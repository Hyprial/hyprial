[project]
name = "hyprial"
# The version lives in ./VERSION, alone on one line.  Allen 2026-09-18:
# 「VERSION 文件单独放,pyproject.toml 引用这个文件」.
#
# Why a file of its own rather than this literal: the number here has been
# "0.4.6" at the v0.4.6 tag and at every commit since -- 357 of them at the
# time of writing -- so "0.4.6" names 358 different trees and identifies none
# of them.  Two installations can report the same version and differ by a
# release's worth of code; that happened, and it cost an evening.  A version
# is an assertion about what a tree contains, and this one asserted something
# nobody checked.  On its own line in its own file, "did the version change?"
# becomes a diff a machine can read instead of a habit people remember.
dynamic = ["version"]
description = "Harness Bridge: decentralized agent communication (Python rewrite)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography",
    "eclipse-zenoh==1.9.0",
    "lark-oapi",
    "jsonschema>=4.26,<5",
    "mcp==2.0.0",
    "packaging",
    "PyYAML",
    "typer",
    "rich",
    "pykka>=4.2,<5",
    "typesafe-sdk==0.7.0",
]

[project.scripts]
hyprial = "hyprial.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.4,<9",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Read the whole first line of ./VERSION.  The default pattern hunts for a
# `__version__ = "..."` assignment, which a bare number file does not have --
# and hatchling's failure there is a build error, not a silent fallback.
[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>[^\\s]+)"

[tool.hatch.build.targets.wheel]
packages = ["src/hyprial"]

[tool.ruff]
target-version = "py312"
# Repro artifacts under notes/repro are kept VERBATIM on purpose: their
# value is byte-fidelity when re-run against future baselines (the PR #332
# findings were re-read on f6598d1 with exactly these files).  Linting them
# invites "fixing" a script whose shape is the evidence -- so they are out
# of lint scope, not out of the tree.
extend-exclude = ["notes/repro"]

[tool.ruff.lint]
# Mandatory Pyflakes plus structural pycodestyle hygiene.  F821 catches
# exception classes referenced without being imported before tests exercise
# the exceptional path.
# W605 added 2026-09-13: a docstring in contract/migration-cutover/drill-run.py
# recorded a `git grep -nE '\bexec...'` command, and because the docstring was
# not raw, `\b` became a backspace and `\(` stayed literal -- so the command
# the file documented was not the command that had been run. Nothing caught it:
# the default rule set omits W605, and the drill ran under python 3.9 where the
# warning is silenced. Enabling it was free: the whole repo had exactly one
# occurrence, the one above.
select = ["E4", "E7", "E9", "F", "W605"]
