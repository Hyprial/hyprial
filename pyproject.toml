[project]
name = "hyprial"
# The version lives in ./VERSION, alone on one line.  Allen 2026-09-18:
# 「VERSION 文件单独放,pyproject.toml 引用这个文件」.
#
# Why a file of its own rather than this literal: the number here has been
# "0.4.6" at the v0.4.6 tag and at every commit since -- 357 of them at the
# time of writing -- so "0.4.6" names 358 different trees and identifies none
# of them.  Two installations can report the same version and differ by a
# release's worth of code; that happened, and it cost an evening.  A version
# is an assertion about what a tree contains, and this one asserted something
# nobody checked.  On its own line in its own file, "did the version change?"
# becomes a diff a machine can read instead of a habit people remember.
dynamic = ["version"]
description = "Harness Bridge: decentralized agent communication"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography",
    "eclipse-zenoh==1.9.0",
    "httpx==0.28.1",
    "lark-oapi",
    "jsonschema>=4.26,<5",
    "mcp==2.0.0",
    "packaging",
    "PyYAML",
    "typer",
    "rich",
    "typesafe-sdk==0.7.0",
    "pycrdt==0.14.9",
    "pycasbin>=2.8,<3",
    "websockets==15.0.1",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httptools==0.9.0",
    "filelock==4.2.9",
    "pywin32==312; sys_platform == 'win32'",
]

[project.scripts]
hyprial = "hyprial.cli:main"

[project.optional-dependencies]
adapter-dingtalk = ["dingtalk-stream==0.24.3"]
adapter-matrix = ["matrix-nio[e2e]==0.26.0", "vodozemac==0.10.0"]
adapter-wecom = ["wecom-aibot-python-sdk==1.0.2"]
test = [
    "pytest>=8.4,<9",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Read the whole first line of ./VERSION.  The default pattern hunts for a
# `__version__ = "..."` assignment, which a bare number file does not have --
# and hatchling's failure there is a build error, not a silent fallback.
[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>[^\\s]+)"

[tool.hatch.build.targets.wheel]
packages = ["src/hyprial"]
# The native actor engine enters a wheel only through the build hook's
# force_include of a freshly compiled module.  A developer-staged
# hyprial/_core module and its stamp (scripts/build/build_native_engine.sh)
# are excluded explicitly, because .gitignore is absent from a Docker
# context or a copied tree and would otherwise let a stale build ship.
exclude = [
    "src/hyprial/_core/*.so",
    "src/hyprial/_core/*.dylib",
    "src/hyprial/_core/*.pyd",
    "src/hyprial/_core/*.stamp.json",
]

# The sdist carries crates/ (the native engine's sources) but never a cargo
# target directory (any crates/target*, e.g. a CARGO_TARGET_DIR such as
# crates/target-conformance) or a developer-staged module.  Hatch reads only
# the root .gitignore, so the GUI's generated node_modules and dist (ignored
# only by gui/.gitignore) are excluded here as well.
[tool.hatch.build.targets.sdist]
exclude = [
    "crates/target*",
    "gui/node_modules",
    "gui/dist",
    "src/hyprial/_core/*.so",
    "src/hyprial/_core/*.dylib",
    "src/hyprial/_core/*.pyd",
    "src/hyprial/_core/*.stamp.json",
]

[tool.hatch.build.hooks.custom]
path = "src/hyprial/gui_build_hook.py"

# uv re-runs the editable build hook only when a cache key changes; the hook
# verifies a staged hyprial._core.actors against its stamp, so the keys are
# the cargo inputs the stamp's digest hashes (native_engine.is_cargo_input)
# plus the staged module and stamp.  uv reduces the keyed files to their newest
# mtime and records it before the build runs, so the tracked epoch file, which
# the opt-in hook touches just before it builds, makes a later deletion of the
# staged module change that value again.  Replacing the default keys means
# pyproject.toml must stay listed.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "crates/Cargo.toml" },
    { file = "crates/Cargo.lock" },
    { file = "crates/hyprial-*/**/Cargo.toml" },
    { file = "crates/hyprial-*/**/*.rs" },
    { file = "src/hyprial/_core/actors.*" },
    { file = "scripts/build/native-engine.epoch" },
    { env = "HYPRIAL_BUILD_NATIVE" },
    { env = "HYPRIAL_BUILD_SKIP_NATIVE" },
]

[tool.pytest.ini_options]
markers = [
    "perf_bound: deterministic daemon degradation guard with a short CI runtime budget",
    "gui_acceptance: opt-in dev01 browser acceptance (needs Node 24 and DEV01_CHROMIUM_EXECUTABLE); excluded from CI pytest shards, run with `pytest -m gui_acceptance`",
]

[tool.ruff]
target-version = "py312"
# Repro artifacts under docs/notes/repro are kept VERBATIM on purpose: their
# value is byte-fidelity when re-run against future baselines (the PR #332
# findings were re-read on f6598d1 with exactly these files).  Linting them
# invites "fixing" a script whose shape is the evidence -- so they are out
# of lint scope, not out of the tree.
# The same holds for a reviewer's checker committed beside its report, whose
# SHA256 the report cites.
extend-exclude = [
    "docs/notes/repro",
    # GUI single-launch prototypes are byte-frozen measurement scripts cited by
    # the archived plans (#2839). Exact paths only, no rule change.
    "docs/notes/gui-single-launch-prototypes-2026-11-15/1e-2-dump-prototype.py",
    "docs/notes/gui-single-launch-prototypes-2026-11-15/daemon-first-prototype/measure_z.py",
    "docs/notes/gui-single-launch-prototypes-2026-11-15/daemon-first-prototype/z_daemon_proto.py",
    "docs/notes/gui-single-launch-prototypes-2026-11-15/daemon-lifecycle-prototype/measure_promotion_relaunch.py",
    "docs/notes/load-0551-review-2026-10-26/independent-audit.py",
    # Reviewer-owned raw evidence is kept byte-for-byte (same rationale as
    # docs/notes/repro); these scripts are not product code.
    "docs/evidence",
    # H-02 live evidence harnesses are byte-frozen WORM artifacts cited by
    # their logs; they are not active runners. Exact paths only, no directory
    # scope and no rule change, so the original bytes stay verbatim.
    "docs/notes/http-h02-client-build-2026-10-31/live/harness/run-live.py",
    "docs/notes/http-h02-client-build-2026-10-31/live/postdispatch/harness/run-live.py",
    # Frozen checkpoint evidence; preserve the verifier bytes cited by its logs.
    "docs/notes/daemon-request-examples-2026-11-03/checkpoint-07/verify-fixed.py",
    # Frozen full-suite and independent merge evidence; preserve recorded bytes.
    "docs/notes/daemon-request-examples-2026-11-03/integration/agent-target-full-suite/archive.py",
    "docs/notes/daemon-request-examples-2026-11-03/integration/agent-target-full-suite/audit.py",
    "docs/notes/daemon-request-examples-2026-11-03/integration/independent-review/agent-target-merge/verify_merge.py",
    "docs/notes/e2e-upgrade-canonical-identity-2026-11-08/registry_migration_control.py",
    "docs/notes/e2e001-recipient-addresses-2026-11-08/address_probe.py",
    "docs/notes/e2e001-recipient-addresses-2026-11-08/address_probe_no_join.py",
    "docs/notes/e2e001-recipient-addresses-2026-11-08/run_check.py",
    "docs/notes/e2e001-relay-ipv4-2026-11-08/public_join_hostname_probe.py",
    "docs/notes/e2e001-relay-ipv4-2026-11-08/public_join_ipv4_probe.py",
    "docs/notes/e2e001-relay-ipv4-2026-11-08/public_join_probe.py",
    "docs/notes/e2e001-relay-ipv4-2026-11-08/public_join_with_links_probe.py",
    "docs/notes/e2e001-relay-ipv4-2026-11-08/run_check.py",
]

[tool.ruff.lint]
# Mandatory Pyflakes plus structural pycodestyle hygiene.  F821 catches
# exception classes referenced without being imported before tests exercise
# the exceptional path.
# W605 added 2026-09-13: a docstring in a (since retired) migration drill
# recorded a `git grep -nE '\bexec...'` command, and because the docstring was
# not raw, `\b` became a backspace and `\(` stayed literal -- so the command
# the file documented was not the command that had been run. Nothing caught it:
# the default rule set omits W605, and the drill ran under python 3.9 where the
# warning is silenced. Enabling it was free: the whole repo had exactly one
# occurrence, the one above.
select = ["E4", "E7", "E9", "F", "W605"]
