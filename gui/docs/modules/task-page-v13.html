const tableRow=r=>`<tr data-task="${esc(r.id)}"><td><button class="task-open native-title" data-open="${esc(r.id)}">${esc(r.title)}</button><div class="task-sub mono">${esc(r.id)}</div></td><td><span class="native-owner">${esc(r.owner||'未记录')}</span>${r.assignee?`<div class="task-sub">被指派：${esc(r.assignee)}</div>`:''}</td><td>${workPill(r.status)}</td><td class="execution-cell"><div class="execution-summary">${r.pacs.length?`<span class="pill ${r.state||'unknown'}">${esc(executionLabel(r))}</span>`:'<span class="pill unknown">未关联 PAC</span>'}</div>${progressMarkup(r)}</td></tr>`;
function table(){const q=$('#query').value.trim().toLocaleLowerCase(),workFilter=$('#work-filter').value,pacFilter=$('#pac-filter').value,relationFilter=$('#relation-filter').value;const matches=r=>(workFilter==='all'||r.status===workFilter)&&(pacFilter==='all'||r.runs.some(run=>run.state===pacFilter))&&(relationFilter==='all'||relationFilter==='human'&&hasHuman(r)||relationFilter==='linked'&&r.pacs.length>0||relationFilter==='unlinked'&&!r.pacs.length);const rows=records().filter(r=>r.title.toLocaleLowerCase().includes(q)&&matches(r));$('#result-count').textContent=`显示 ${rows.length} 项，共 ${records().length} 项`;
$('#task-list').innerHTML=rows.length?`<table class="task-table native-table"><thead><tr><th scope="col">工作项</th><th scope="col">工作项负责人 / 被指派人</th><th scope="col">工作项状态</th><th scope="col">PAC 执行 / 步骤进度</th></tr></thead><tbody>${rows.map(tableRow).join('')}</tbody></table>`:'<div class="empty"><h3>没有匹配的工作项</h3><p class="muted small">更换关键词或清除筛选。</p><button class="button secondary" data-clear>清除筛选</button></div>';}
function humanItems(){const rows=records().filter(hasHuman);$('#human-items').hidden=!rows.length;$('#human-items').innerHTML=`<div class="section-heading"><h2 id="human-title">本人可处理</h2><span class="count">${rows.length}</span></div><div class="attention-grid">${rows.map(r=>`<div class="attention-item"><div><h3>${esc(r.title)}</h3><p>步骤 ${esc(ns(r).filter(n=>n.localHumanCanComplete).map(n=>n.nodeId).join('、'))}</p></div><button class="icon-button" data-open="${esc(r.id)}" aria-label="查看${esc(r.title)}">↗</button></div>`).join('')}</div>`;}
function overview(r){return `<section class="detail-card"><dl class="summary-grid">${field('工作项负责人',r.owner)}${field('工作项指派人',r.assignee)}${field('工作项状态',workStatusWords[r.status]||r.status)}${r.opened!=null?field('打开时间',fullTime(r.opened)):''}${r.closed!=null?field('关闭时间',fullTime(r.closed)):''}${r.path?field('文件路径',r.path):''}</dl>${r.acceptance?`<p class="view-note">验收说明：${esc(r.acceptance)}</p>`:''}${r.log.length?`<pre class="output">${esc(r.log.join('\n'))}</pre>`:''}</section>`;}
function graph(r){const nodes=ns(r),edges=response(r).edges;const ranks={};function rank(id,seen=new Set()){if(ranks[id]!=null)return ranks[id];if(seen.has(id))return 0;const p=edges.filter(e=>e.kind==='forward'&&e.to===id).map(e=>e.from);return ranks[id]=p.length?1+Math.max(...p.map(x=>rank(x,new Set(seen).add(id)))):0;}const cols=[];nodes.forEach(n=>(cols[rank(n.nodeId)]??=[]).push(n));if(!nodes.length)return '<p class="muted small">此状态响应中没有步骤记录。</p>';return `<div class="graph"><div class="graph-stage" style="grid-template-columns:repeat(${cols.length},minmax(0,1fr))"><svg aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#8a9580" stroke-width="1.2"/></marker></defs><g id="graph-lines"></g></svg>${cols.map(col=>`<div class="graph-column">${col.map(n=>`<button class="node" data-node="${esc(n.nodeId)}" aria-pressed="${state.nodeId===n.nodeId}"><span class="node-name mono">${esc(n.nodeId)}</span><small class="mono">${esc(n.owner)}</small>${pill(n.state)}</button>`).join('')}</div>`).join('')}</div><div class="legend"><span>→ 步骤关系</span><span>同一层表示并行</span></div></div>`;}
function nodeDetails(r){const n=ns(r).find(n=>n.nodeId===state.nodeId);if(!n)return '';return `<section class="node-focus"><h3 class="mono">${esc(n.nodeId)}</h3><dl>${field('步骤负责人',n.owner)}<div><dt>步骤状态</dt><dd>${pill(n.state)}</dd></div>${n.outputText!=null?`<div class="wide"><dt>步骤输出</dt><dd><pre class="output">${esc(n.outputText)}</pre></dd></div>`:''}</dl></section>`;}
function steps(r){return `<section><div class="output-title"><h3>步骤与依赖</h3><span class="muted small">${ns(r).length} 个步骤</span></div>${graph(r)}</section>${nodeDetails(r)}`;}
function draw(){const r=currentRecord(),stage=$('.graph-stage'),g=$('#graph-lines');if(!stage||!g)return;const box=stage.getBoundingClientRect();g.innerHTML=response(r).edges.filter(e=>e.kind==='forward').map(e=>{const a=stage.querySelector(`[data-node="${e.from}"]`)?.getBoundingClientRect(),b=stage.querySelector(`[data-node="${e.to}"]`)?.getBoundingClientRect();if(!a||!b)return '';const x=a.right-box.left,y=a.y+a.height/2-box.y,x2=b.left-box.left,y2=b.y+b.height/2-box.y;return `<path data-edge="${e.from}:${e.to}" d="M${x} ${y} C${(x+x2)/2} ${y} ${(x+x2)/2} ${y2} ${x2-3} ${y2}" fill="none" stroke="#8a9580" stroke-width="1.4" marker-end="url(#arrow)"/>`;}).join('');}
function renderDetail(){const r=currentRecord();if(!r)return;$('#detail-heading').innerHTML=`<span class="sample">任务详情 · 示例数据</span><h2 id="detail-title">${esc(r.title)}</h2><div class="detail-context">${esc(executionLabel(r))}</div>`;$('#detail-panel').setAttribute('aria-labelledby','detail-title');$('#detail-panel').innerHTML=overview(r)+(available(r)?steps(r):'');requestAnimationFrame(draw);}
function open(id){state.selected=id;state.tab='overview';state.nodeId=ns(currentRecord())?.[0]?.nodeId||null;renderDetail();$('#detail-panel').scrollTop=0;$('#detail').showModal();$('#close-detail').focus();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.open)open(b.dataset.open);else if(b.dataset.node){const y=$('#detail-panel').scrollTop;state.nodeId=b.dataset.node;renderDetail();$('#detail-panel').scrollTop=y;document.querySelector(`[data-node="${state.nodeId}"]`)?.focus();}else if(b.hasAttribute('data-clear')){$('#query').value='';$('#work-filter').value='all';$('#pac-filter').value='all';$('#relation-filter').value='all';table();$('#query').focus();}});
$('#close-detail').addEventListener('click',()=>$('#detail').close());$('#query').addEventListener('input',table);$('#work-filter').addEventListener('change',table);$('#pac-filter').addEventListener('change',table);$('#relation-filter').addEventListener('change',table);window.addEventListener('resize',draw);
$('#observed-time').textContent='字段核对时间 '+fullTime(fixtures.overview.observedAt);humanItems();table();
</script>
</body></html>
