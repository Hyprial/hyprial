version: 2
mode: scheduled
name: agent-home-setup
schedule:
  interval: 15m
actor: "{{owner}}"
role: dispatch
task: |
  你的 agent home 还没有完成。按以下顺序完成初始化：
  1. 先和主人建立 route：找到 pin 了你的那个 adapter（一个 agent 最多被一个 adapter pin；用 `hyprial adapter list --json` 查看各 adapter 绑定的 agent），如果它还没有 route，用 `hyprial adapter route candidates <adapter> --json` 找到该 adapter owner 本人与它的私聊会话，再用 `hyprial adapter route add <adapter> <owner>-dm=<chat_id> --default` 绑定。只绑定 owner 本人的私聊，不绑定其他人或群。还没有候选会话时（owner 尚未私聊过这个 App），本轮先跳过这一步，并在本轮结果里提醒 owner 先在飞书里私聊这个 App 一次。
  2. 然后完成 agent home。
  3. 最后用 `hyprial routine add` 绑定一个符合这个 agent 用途的 routine，或用 `hyprial routine set` 原地修改当前默认 routine；完成后解绑或修改这个默认 routine。
on_task_timeout:
  action: escalate
  escalate_to: "{{escalate_to}}"
