# Dev-first migration, 2026-11-08: candidates are immutable commits in dev history.
# Formal publication is held while the consolidated candidate awaits exact-SHA
# platform, migration and E2E evidence. Dry runs still evaluate every source gate.
# 发布规则唯一事实源：docs/guides/release-rules.md；锚点与轨道 mover 保持分离。
# release-tag —— 在源仓创建一个版本 tag,交给 github-publish 去发布。
#
# 契约(Allen 2026-09-16 指定「构造 CI 自动打 tag」):
#   - tag 在【源仓】创建,⛔ 不在 GitHub 上直接创建。理由是【产物】而不是
#     【流程】:镜像上那个含新版本的提交是 github-publish 自己 stage 出来
#     的,在 GitHub 上直接打 tag 只能指向上一次发布的树 —— 而目标仓 v*
#     不可变,于是必定造出「tag 写 vX,内容是 vY」且全程不报错的工件。
#   - 触发只有 workflow_dispatch,且三个输入全部显式传参。授权一个【作业】
#     没有「用完即止」这个性质,而平台把 dispatch 的 inputs 逐次记进
#     event_payload —— 所以参数化是审计要求,⛔ 不是接口口味。凡不从参数
#     走的东西,事后查不到。
#   - sha 必须是完整 40 位。ref 名在这个仓里是危险的:dev 同时是分支名和
#     标签名,而服务端解析 base="dev" 会命中标签(已发生两次)。SHA 是
#     「哪台机器 / 哪一刻 / 谁在解析」三个维度上都不变的唯一形式。
#   - dry_run 默认 true;真推要显式关掉。
#   - ⛔ 不与 *-track 的 mover 合并进同一个作业:发布锚点与轨道指针是两件
#     事,绑在一个动作里就没法只做其中一件。
#   - `uses:` 允许(Allen 2026-09-21),但**必须钉住版本**(`@<版本或 40-hex SHA>`,
#     ⛔ 浮动引用);本 workflow 目前不引入任何 `uses:`,因为 #503:远端 action 在
#     step 之前拉取,脚本的 fail-soft 管不到。判定见 tests/support/ci/ci_workflow_policy.py。
#
# ⚠️ 三道硬闸问的都是「这个 SHA 合不合规」,⛔ 没有一道在问「这个 SHA 是不是
#    被授权的那一个」—— 闸检查性质,而授权是出处问题,性质检查在原理上答不
#    了。所以实际使用的 SHA 会写进【报告体】,而⛔ 不只是日志:日志给排查
#    用,报告体给复核用,替换这件事事后唯一能被看见的地方,就是报告里那个
#    SHA 与授权里那个 SHA 并列着。

name: release-tag
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to create, e.g. v0.4.6 (v* only; *-track is not this job)"
        required: true
      sha:
        description: "full 40-hex commit to tag (⛔ not a ref name)"
        required: true
      dry_run:
        description: "walk every gate without creating or pushing the tag"
        required: false
        default: "true"

concurrency:
  group: release-tag-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: [release-ci]
    # 只有 fetch + 几次 git 读 + 一次 push;没有构建,也没有外网下载。
    timeout-minutes: 10
    env:
      FORMAL_PUBLICATION_ENABLED: "false"
      HTTPS_PROXY: http://host.docker.internal:7896
      HTTP_PROXY: http://host.docker.internal:7896
      NO_PROXY: localhost,127.0.0.1,::1,tailscale,forgejo-tailscale,.ts.net,.internal.hyprial.com,code.hyprial.com
    steps:
      - name: Check out and fetch the target (intranet origin)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_SHA: ${{ github.event.inputs.sha }}
        run: |
          set -euo pipefail
          server_host="${GITHUB_SERVER_URL#http://}"
          server_host="${server_host#https://}"
          server_host="${server_host%%[:/]*}"
          export NO_PROXY="${NO_PROXY},${server_host}"
          ASKPASS="/tmp/reltag-askpass-${GITHUB_RUN_ID}"
          cat >"${ASKPASS}" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "${GITHUB_TOKEN}" ;;
          esac
          SH
          chmod 700 "${ASKPASS}"
          echo "${ASKPASS}" > /tmp/reltag-askpass-path
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}.git"
          # ⛔ 不用 --depth:祖先判定要真实的历史,浅克隆会让它答错。
          GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0 \
            git fetch --no-tags origin "+refs/heads/dev:refs/remotes/origin/dev"
          GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0 \
            git fetch --no-tags origin "${IN_SHA}"
          # ⛔ Do not drop this: `git init` leaves an EMPTY working tree, so the
          # next step's `source scripts/ci/ci-step.sh` would die on its first line
          # and not one of the three gates would run.  Every other job in this
          # repo checks out after fetching for the same reason
          # (gate-python.yml, github-publish.yml).
          #
          git checkout --detach refs/remotes/origin/dev

      - name: Gates (tag free · version matches · ancestor of dev)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_TAG: ${{ github.event.inputs.tag }}
          IN_SHA: ${{ github.event.inputs.sha }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          source scripts/ci/ci-step.sh release-tag/gates
          ASKPASS="$(cat /tmp/reltag-askpass-path)"
          export GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0
          server_host="${GITHUB_SERVER_URL#http*://}"; server_host="${server_host%%[:/]*}"
          export NO_PROXY="${NO_PROXY},${server_host}"

          dev_head="$(git rev-parse refs/remotes/origin/dev)"
          # 这一行在每条拒绝信息里都会出现:三道闸都在问「这个 SHA 合不合规」,
          # 而「仓库动了」与「我输错了」的处置相反,拒绝信息必须能分开它们。
          if [ "${IN_SHA}" = "${dev_head}" ]; then
            pinned_state="the pinned sha IS refs/heads/dev right now"
          else
            pinned_state="⚠️ the pinned sha is NOT refs/heads/dev right now (dev = ${dev_head}) -- if you did not expect that, the repository moved and the answer is to go back for the authorized sha, ⛔ NOT to retype one you believe is right"
          fi

          # ⛔ Not a shell `case` glob: `[0-9a-f]*` only constrains the FIRST
          # character, so a 40-char string with hex at the front and rubbish
          # after it would pass the format gate and fail later as a git error
          # instead of the message written here.
          if ! printf '%s' "${IN_SHA}" | grep -qE '^[0-9a-f]{40}$'; then
            echo "sha must be exactly 40 lowercase hex characters, got '${IN_SHA}' (${#IN_SHA} chars) -- ⛔ ref names are not accepted"
            echo "  ${pinned_state}"
            exit 1
          fi

          case "${IN_TAG}" in
            v[0-9]*) : ;;
            *) echo "refusing tag '${IN_TAG}': this job creates v* release anchors only (a *-track pointer is a different action, deliberately not in this job)"; exit 1 ;;
          esac

          # ① the tag must not already exist -- v* is immutable at the mirror,
          #    so a second push cannot repair a first one that was wrong.
          if ! existing="$(git ls-remote --refs origin "refs/tags/${IN_TAG}")"; then
            echo "gate 1 FAILED: cannot read the remote release tag"
            echo "  ${pinned_state}"
            exit 1
          fi
          if [ -n "${existing}" ]; then
            echo "gate 1 FAILED: refs/tags/${IN_TAG} already exists (${existing})."
            echo "  ${pinned_state}"
            exit 1
          fi
          echo "gate 1 ok: refs/tags/${IN_TAG} does not exist"

          # ② the declared version must equal the version in the tag name.
          #    Read ./VERSION at that sha, which is the file the build itself
          #    reads; pyproject declares the version dynamic and no longer
          #    carries the literal.  Read out of the object store rather than a
          #    checkout, for the same reason the rest of this job does.
          want="${IN_TAG#v}"
          got="$(git show "${IN_SHA}:VERSION" 2>/dev/null | tr -d '[:space:]')"
          if [ "${got}" != "${want}" ]; then
            echo "gate 2 FAILED: version mismatch"
            echo "  expected (from tag name): ${want}"
            echo "  measured (VERSION at ${IN_SHA}): ${got:-<unreadable>}"
            echo "  ${pinned_state}"
            exit 1
          fi
          echo "gate 2 ok: pyproject.toml at ${IN_SHA} declares ${got}"

          if ! git merge-base --is-ancestor "${IN_SHA}" refs/remotes/origin/dev; then
            echo "gate 3 FAILED: ${IN_SHA} is not an ancestor of refs/heads/dev (${dev_head})"
            echo "  ${pinned_state}"
            exit 1
          fi
          echo "gate 3 ok: ${IN_SHA} is an ancestor of refs/heads/dev"

          # ④ Read the target's notes, not the tooling checkout's CHANGELOG.
          # Set TAG_NAME only AFTER this succeeds: the always() push step
          # treats that variable as the proof that every gate passed.
          if ! node scripts/ci/check-changelog.mjs --tag "${IN_TAG}" --rev "${IN_SHA}"; then
            echo "gate 4 FAILED: release changelog missing, empty, or version mismatch"
            echo "  ${pinned_state}"
            exit 1
          fi

          {
            echo "TAG_NAME=${IN_TAG}"
            echo "TAG_SHA=${IN_SHA}"
            echo "DEV_HEAD=${dev_head}"
            echo "DRY=$(printf '%s' "${IN_DRY:-true}" | tr '[:upper:]' '[:lower:]')"
          } >> "${GITHUB_ENV}"

      - name: Create and push the tag
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # 报告体在 trap 里写,所以它在【失败路径】上也会出现。一个只在成功
          # 时出现的报告,测的不是「发生了什么」,是「事情顺利吗」—— 而那件事
          # 退出码已经说了。
          outcome="not reached"
          peeled=""
          report() {
            {
              echo ""
              echo "### release-tag"
              echo ""
              echo "| field | value |"
              echo "| --- | --- |"
              echo "| tag | \`${TAG_NAME:-<unset>}\` |"
              echo "| **sha actually used** | \`${TAG_SHA:-<unset>}\` |"
              echo "| refs/heads/dev at gate time | \`${DEV_HEAD:-<unset>}\` |"
              echo "| dry_run | \`${DRY:-true}\` |"
              echo "| outcome | ${outcome} |"
              echo "| peeled readback | \`${peeled:-<none>}\` |"
              echo ""
              echo "⚠️ The sha above is the one this run used. Compare it against the sha in"
              echo "the authorization: the three gates check whether a sha is *admissible*,"
              echo "never whether it is *the authorized one* -- that is a provenance question"
              echo "and no property check can answer it. This row is where a substitution"
              echo "becomes visible afterwards."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "release-tag: outcome tag=${TAG_NAME:-<unset>} sha=${TAG_SHA:-<unset>} dry_run=${DRY:-true} result=${outcome}"
          }
          trap report EXIT

          if [ -z "${TAG_NAME:-}" ]; then
            outcome="gates did not pass; nothing was created"
            exit 1
          fi

          if [ "${DRY}" = "true" ]; then
            outcome="dry-run: every gate passed, ⛔ nothing created or pushed"
            exit 0
          fi

          if [ "${FORMAL_PUBLICATION_ENABLED:-false}" != "true" ]; then
            outcome="formal publication is held pending exact-candidate release evidence"
            echo "${outcome}" >&2
            exit 1
          fi

          ASKPASS="$(cat /tmp/reltag-askpass-path)"
          export GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0
          server_host="${GITHUB_SERVER_URL#http*://}"; server_host="${server_host%%[:/]*}"
          export NO_PROXY="${NO_PROXY},${server_host}"

          git -c user.name="hyprial-ci" -c user.email="ci@hyprial.com" \
            tag -a "${TAG_NAME}" -m "${TAG_NAME}" "${TAG_SHA}" || {
              outcome="tag object could not be created"; exit 1; }
          git push origin "refs/tags/${TAG_NAME}" || {
              outcome="push of refs/tags/${TAG_NAME} failed"; exit 1; }

          # 回读分三态:annotated 指对 / annotated 指错 / 轻量(没有 ^{} 那一行,
          # 读出来是空的,而空会表现得像「这个 tag 不存在」)。源仓 19 个 tag 里
          # v0.4.0 就是轻量的 —— 这不是假想。
          obj="$(git ls-remote origin "refs/tags/${TAG_NAME}" | awk '{print $1}')"
          peeled="$(git ls-remote origin "refs/tags/${TAG_NAME}^{}" | awk '{print $1}')"
          if [ -z "${obj}" ]; then
            outcome="⛔ readback: the tag is absent after a push that reported success"
            exit 1
          elif [ -z "${peeled}" ]; then
            if [ "${obj}" = "${TAG_SHA}" ]; then
              outcome="pushed, but as a LIGHTWEIGHT tag pointing at the right commit"
            else
              outcome="⛔ readback: lightweight tag points at ${obj}, expected ${TAG_SHA}"
              exit 1
            fi
          elif [ "${peeled}" != "${TAG_SHA}" ]; then
            outcome="⛔ readback: annotated tag peels to ${peeled}, expected ${TAG_SHA}"
            exit 1
          else
            outcome="pushed: annotated tag peels to the requested sha"
          fi
          # ⛔ This does NOT set github-publish going.  Measured on the first real
          # run (release-tag 4092 pushed v0.4.6 -> dd13e702; zero github-publish
          # runs followed): a tag pushed with secrets.GITHUB_TOKEN does not
          # trigger workflows -- upstream keeps the actions user from starting
          # runs so that a job cannot trigger itself forever.  The tag is real;
          # the publish has to be started separately against it.
          #
          # ⚠️ An earlier version of this line claimed the opposite, and it
          # survived two review rounds: both readers checked the three gates and
          # neither asked what happens *after* the push.  A job's acceptance
          # stops at its own exit code, while its point usually lives in the
          # step after it.
          echo "release-tag: the tag exists; the push itself starts nothing."
          echo "  a tag pushed with secrets.GITHUB_TOKEN does not trigger workflows (upstream, by design)"
          echo "  ⇒ the next step dispatches github-publish explicitly against this tag"

      # ⭐ 闭合那条链。上面那段注释记下了缺口:标签被造出来,然后【什么也没发生】——
      # 而 v0.4.6 正是这么卡了一整天(release-tag 4092 推出 dd13e702,随后零次 github-publish)。
      #
      # 为什么这一步能成而 push 不能:上游挡的是【事件】——用 actions 令牌推送的 ref 不产生
      # 触发事件,免得作业无限触发自己。而 dispatch 是一次【显式 API 调用】,不是事件。
      # 2026-09-17 手工验证过两次,都真的起跑了。
      #
      # ⚠️ 这一步失败必须是【红的】。整条链的原始病就是"绿了,而下一步根本没发生"——
      # 所以宁可在标签已推出之后把这次运行判红,也不要留下一个绿色的、什么都没发布的结果。
      # ⚠️ 这个 if 有两处必须按【实际发生的事】写,而不是按输入写:
      #   · `success() &&` 不能省 —— 一个显式的 if 会【替换】掉隐含的 success(),
      #     省了它,前面那步失败之后这步照样跑。
      #   · 判据用 env.DRY(gates 步算出来并写进 GITHUB_ENV 的那个值),⛔ 用
      #     github.event.inputs.dry_run:输入【省略】时后者是空串,而 `'' != 'true'`
      #     为真 —— 可那种情况下 gates 取的是默认 true、标签根本没被创建,
      #     于是这一步会去发布一个不存在的标签。env.DRY 记录的是真正走过的那条路。
      - name: Start github-publish against the tag just created
        if: ${{ success() && env.DRY == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source scripts/ci/ci-step.sh release-tag/chain
          server_host="${GITHUB_SERVER_URL#http*://}"; server_host="${server_host%%[:/]*}"
          export NO_PROXY="${NO_PROXY},${server_host}"
          api="${GITHUB_SERVER_URL%/}/api/v1/repos/${GITHUB_REPOSITORY}/actions/workflows"

          # ⭐ ref 必须是【标签本身】。github-publish 的快照取自运行所在的 ref,而
          # inputs.ref 只决定发布成哪个标签名 —— 填成 dev 会把 dev 的树当作这个标签发出去。
          # (那一格现在在 github-publish 里也有守卫,这里是同一条不变式的另一端。)
          body="$(printf '{"ref":"%s","inputs":{"ref":"%s","dry_run":"false","report_pr":"0"}}' \
            "${TAG_NAME}" "${TAG_NAME}")"
          code="$(printf 'header = "Authorization: token %s"\n' "${GITHUB_TOKEN}" | \
            curl --config - --location --silent --show-error -o /tmp/reltag-chain.out -w '%{http_code}' \
            -H "Content-Type: application/json" -X POST --data "${body}" \
            "${api}/github-publish.yml/dispatches")"
          echo "release-tag/chain: dispatch github-publish ref=${TAG_NAME} => http ${code}"
          case "${code}" in
            20*) : ;;
            *)
              echo "release-tag/chain: dispatch FAILED (http ${code})" >&2
              sed -n '1,5p' /tmp/reltag-chain.out >&2 || true
              echo "  the tag ${TAG_NAME} exists and is correct; only the publish did not start." >&2
              echo "  run it by hand, and note the ref must be the tag itself:" >&2
              echo "    workflow=github-publish.yml ref=${TAG_NAME} inputs.ref=${TAG_NAME} dry_run=false" >&2
              exit 1
              ;;
          esac

          # ⚠️ Readback, because "the API accepted it" is not "a run exists" —— 这正是这条链
          # 想修的那个病的同一形态:接受 ≠ 发生。给调度一点时间,然后去数真的有没有那次运行。
          auth_config() {
            printf 'header = "Authorization: token %s"\n' "${GITHUB_TOKEN}"
          }
          started=""
          for _ in 1 2 3 4 5 6; do
            sleep 5
            # ⚠️ 这个 python 必须写成【一行】。`python3 -c` 的脚本对前导空格敏感,
            # 而 YAML 块标量里的每一行又必须缩进到块内 —— 多行内嵌脚本要么让 python
            # 报 IndentationError,要么顶到左边距把块标量提前终止(我第一版就是后者)。
            started="$(auth_config | curl --config - --location --silent --show-error "${GITHUB_SERVER_URL%/}/api/v1/repos/${GITHUB_REPOSITORY}/actions/tasks?limit=30" | python3 -c 'import json,sys; rows=(json.load(sys.stdin).get("workflow_runs") or []); hit=[r for r in rows if r.get("workflow_id")=="github-publish.yml" and r.get("head_branch")==sys.argv[1]]; print(hit[0]["id"] if hit else "")' "${TAG_NAME}")"
            [ -n "${started}" ] && break
          done
          if [ -z "${started}" ]; then
            echo "release-tag/chain: the dispatch was accepted (http ${code}) but no github-publish run" >&2
            echo "  appeared for ${TAG_NAME} within 30s. Accepted is not started." >&2
            exit 1
          fi
          echo "release-tag/chain: github-publish run ${started} is up for ${TAG_NAME}"
