# homepage-changelog-sync —— 为正式发布生成 Homepage 候选记录
#
# 契约(计划 docs/design/public-changelog-release-sync-implementation-plan-2026-10-16.md
# 的 Task 3;权威 guard 在 HyprialOS/homepage@ci/release-origin-guard):
#   - 只有「来源调度身份」能触发:github-publish.yml 成功发布 v* 后显式
#     dispatch;历史 v0.4.6 回填由发布负责人做一次受控 workflow_dispatch。
#     ⛔ 不监听 pull_request / push。
#   - 本 workflow 只 checkout `dev` 取工具,显式 fetch 不可变 tag;不接受
#     任何会选中移动 ref 的默认值。
#   - 四身份分离:source dispatcher(本 workflow 的调用方)、
#     HOMEPAGE_CANDIDATE_TOKEN(建分支/PR)、
#     HOMEPAGE_GUARD_DISPATCH_TOKEN(只 dispatch 守卫)、
#     GUARD_STATUS_TOKEN(只在守卫侧,本 workflow 永不持有)。
#   - 本 workflow **不写任何 commit status**;status 只由
#     homepage-release-origin-guard 用它自己的 token 写。
#   - 校验不通过就在任何 Homepage API 写入之前失败;Task 1 校验由
#     scripts/release/homepage_changelog.py 实现,Task 2 是本 workflow 唯一
#     的 Homepage 客户端。
#   - 历史模式必须显式 `historical=true` + `metadata_sha`;普通发布 metadata
#     必须等于 source。
#   - ⛔ 不 push draft/main、不合并、不改写已有发布记录。

name: homepage-changelog-sync

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "immutable release tag (v<X.Y.Z>)"
        required: true
      source_sha:
        description: "peeled source commit SHA (40 lowercase hex)"
        required: true
      metadata_sha:
        description: "metadata snapshot commit (empty = source_sha; historical only)"
        required: false
        default: ""
      historical:
        description: "true only for the one-time historical backfill"
        required: false
        default: "false"
      dry_run:
        description: "validate and classify without creating a branch/PR or dispatching the guard"
        required: false
        default: "false"

concurrency:
  group: homepage-changelog-${{ inputs.source_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HTTPS_PROXY: http://host.docker.internal:7896
      HTTP_PROXY: http://host.docker.internal:7896
      NO_PROXY: localhost,127.0.0.1,::1,tailscale,forgejo-tailscale,.ts.net,.internal.hyprial.com,code.hyprial.com
      HOMEPAGE_CANDIDATE_TOKEN: ${{ secrets.HOMEPAGE_CANDIDATE_TOKEN }}
      HOMEPAGE_GUARD_DISPATCH_TOKEN: ${{ secrets.HOMEPAGE_GUARD_DISPATCH_TOKEN }}
      SOURCE_TAG: ${{ inputs.source_tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      METADATA_INPUT: ${{ inputs.metadata_sha }}
      HISTORICAL: ${{ inputs.historical }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Preflight (secrets and inputs)
        run: |
          set -euo pipefail
          # Missing secrets fail first, loudly, before any network write; the
          # values are never printed.
          [ -n "${HOMEPAGE_CANDIDATE_TOKEN}" ] || { echo "secret HOMEPAGE_CANDIDATE_TOKEN missing"; exit 1; }
          [ -n "${HOMEPAGE_GUARD_DISPATCH_TOKEN}" ] || { echo "secret HOMEPAGE_GUARD_DISPATCH_TOKEN missing"; exit 1; }
          case "${HISTORICAL}" in true|false) ;; *) echo "historical must be true or false"; exit 1 ;; esac
          printf '%s' "${SOURCE_TAG}" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            || { echo "source_tag must be v<X.Y.Z>"; exit 1; }
          printf '%s' "${SOURCE_SHA}" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "source_sha must be 40 lowercase hex characters"; exit 1; }
          if [ "${HISTORICAL}" = "true" ]; then
            printf '%s' "${METADATA_INPUT}" | grep -Eq '^[0-9a-f]{40}$' \
              || { echo "historical mode requires metadata_sha (40 lowercase hex)"; exit 1; }
          elif [ -n "${METADATA_INPUT}" ] && [ "${METADATA_INPUT}" != "${SOURCE_SHA}" ]; then
            echo "standard mode requires metadata_sha to be empty or equal to source_sha"
            exit 1
          fi

      - name: Check out dev tools only (intranet origin)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          server_host="${GITHUB_SERVER_URL#http://}"
          server_host="${server_host#https://}"
          server_host="${server_host%%[:/]*}"
          export NO_PROXY="${NO_PROXY},${server_host}"
          ASKPASS="/tmp/changelog-sync-askpass-${GITHUB_RUN_ID}"
          trap 'rm -f "${ASKPASS}"' EXIT
          cat >"${ASKPASS}" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "${GITHUB_TOKEN}" ;;
          esac
          SH
          chmod 700 "${ASKPASS}"
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}.git"
          GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0 \
            git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Fetch and verify the immutable tag snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASKPASS="/tmp/changelog-sync-askpass-fetch-${GITHUB_RUN_ID}"
          trap 'rm -f "${ASKPASS}"' EXIT
          cat >"${ASKPASS}" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "${GITHUB_TOKEN}" ;;
          esac
          SH
          chmod 700 "${ASKPASS}"
          export GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0

          # The tag is the only source of release data; no default can select a
          # moving ref.
          git fetch --depth=1 origin "refs/tags/${SOURCE_TAG}:refs/tags/${SOURCE_TAG}"
          tag_sha="$(git rev-parse "refs/tags/${SOURCE_TAG}^{commit}")"
          [ "${tag_sha}" = "${SOURCE_SHA}" ] \
            || { echo "tag ${SOURCE_TAG} resolves to ${tag_sha}, not ${SOURCE_SHA}"; exit 1; }

          metadata="${METADATA_INPUT:-${SOURCE_SHA}}"
          if [ "${HISTORICAL}" = "false" ]; then
            [ "${metadata}" = "${SOURCE_SHA}" ] \
              || { echo "standard mode requires metadata_sha == source_sha"; exit 1; }
          fi
          if ! git cat-file -e "${metadata}^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "${metadata}"
          fi
          git cat-file -e "${metadata}^{commit}" \
            || { echo "metadata commit ${metadata} is not available"; exit 1; }
          # Historical: the metadata commit must descend from the source commit;
          # standard equality also passes.
          git merge-base --is-ancestor "${SOURCE_SHA}" "${metadata}" \
            || { echo "metadata ${metadata} does not descend from source ${SOURCE_SHA}"; exit 1; }
          echo "METADATA_SHA=${metadata}" >> "${GITHUB_ENV}"

      - name: Validate facts and emit the canonical record
        run: |
          set -euo pipefail
          version="${SOURCE_TAG#v}"
          # parse_manifest requires the reviewed filename <version>.yml.
          work="/tmp/changelog-sync-${GITHUB_RUN_ID}"
          mkdir -p "${work}"
          manifest="${work}/${version}.yml"
          changelog="${work}/CHANGELOG.md"
          record="${work}/${version}.md"
          git show "${METADATA_SHA}:docs/releases/${version}.yml" > "${manifest}"
          git show "${METADATA_SHA}:CHANGELOG.md" > "${changelog}"
          python3 scripts/release/homepage_changelog.py validate \
            --repo . \
            --manifest "${manifest}" \
            --changelog "${changelog}" \
            --tag "${SOURCE_TAG}" \
            --source-sha "${SOURCE_SHA}" \
            --metadata-sha "${METADATA_SHA}" \
            --historical "${HISTORICAL}" \
            --out "${record}"
          {
            echo "MANIFEST_FILE=${manifest}"
            echo "CHANGELOG_FILE=${changelog}"
            echo "RECORD_FILE=${record}"
          } >> "${GITHUB_ENV}"

      - name: Create the Homepage candidate and dispatch the guard
        run: |
          set -euo pipefail
          # Point the client at the job-side Forgejo instance, never a hardcoded host.
          export FORGEJO_API_URL="${GITHUB_SERVER_URL%/}/api/v1"
          python3 scripts/release/homepage_changelog.py publish \
            --repo . \
            --manifest "${MANIFEST_FILE}" \
            --changelog "${CHANGELOG_FILE}" \
            --tag "${SOURCE_TAG}" \
            --source-sha "${SOURCE_SHA}" \
            --metadata-sha "${METADATA_SHA}" \
            --historical "${HISTORICAL}" \
            --dry-run "${DRY_RUN}"
