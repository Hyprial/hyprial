# gate-native-shell —— the minimal native shell's launcher crate (PR 6b).
#
# Decision record (file header; no inline comments by repository rule):
# - Scope: only `clients/native/**`, `contract/cli/**` (the startup-record
#   corpus the launcher parses) and this file start the workflow, through the
#   `paths` filters below; no other suite depends on the shell.
# - The job tests the Tauri-free crate `hyprial-shell-launcher` on Linux:
#   `cargo fmt --check`, `cargo test --locked` and `cargo clippy -D warnings`.
#   The Tauri crate `clients/native/src-tauri` needs a webview SDK and is not
#   built here; its build and smoke run on a macOS arm64 host (shell-6.md §E.2).
# - Rust is the repository's pinned 1.93.1 from scripts/ci/ci-ensure-rust.sh
#   (the same installer native-conformance.yml uses), never a floating action.
#   That installer stages the minimal profile; rustfmt and clippy are added to
#   the same pinned toolchain with the verified rustup it bootstrapped, whose
#   component downloads are checked against the official channel manifest.
# - The job carries the shared CI conditions tail (start reader first, end /
#   upload / report last), like every other instrumented job.
# - Checkout uses ${GITHUB_SERVER_URL} inside the job container with a
#   step-level GITHUB_TOKEN, as in native-conformance.yml.
name: gate-native-shell

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [dev, main]
    paths:
      - "clients/native/**"
      - "contract/cli/**"
      - ".forgejo/workflows/gate-native-shell.yml"
  push:
    branches: [dev, main]
    paths:
      - "clients/native/**"
      - "contract/cli/**"
      - ".forgejo/workflows/gate-native-shell.yml"

concurrency:
  group: gate-native-shell-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  launcher:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node:24-bookworm
    timeout-minutes: 30
    env:
      HTTPS_PROXY: http://host.docker.internal:7896
      HTTP_PROXY: http://host.docker.internal:7896
      NO_PROXY: localhost,127.0.0.1,::1,tailscale,forgejo-tailscale,.ts.net,.internal.hyprial.com,code.hyprial.com
      UV_HTTP_TIMEOUT: "300"
      UV_HTTP_RETRIES: "10"
    steps:
      - name: Check out commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASKPASS="/tmp/hyprial-git-askpass-${GITHUB_RUN_ID}"
          cat >"${ASKPASS}" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "${GITHUB_TOKEN}" ;;
          esac
          SH
          chmod 700 "${ASKPASS}"
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}.git"
          GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0 \
            git fetch --depth=1 origin "${GITHUB_SHA}"
          rm -f "${ASKPASS}"
          git checkout --detach FETCH_HEAD
          bash scripts/ci/ci-conditions.sh start

      - name: Ensure uv and the pinned CPython
        timeout-minutes: 6
        run: |
          set -euo pipefail
          UV_VERSION=0.11.7 bash scripts/ci/ci-ensure-uv.sh
          bash scripts/ci/ci-uv-cache.sh "${RUNNER_TEMP:-/tmp}/uv-cache"
          bash scripts/ci/ci-ensure-cpython-mirror.sh

      - name: Ensure pinned Rust 1.93.1
        timeout-minutes: 20
        env:
          HYPRIAL_E2E_ROOT: ${{ runner.temp }}/native-shell-rust
        run: |
          set -euo pipefail
          bash scripts/ci/ci-ensure-rust.sh

      - name: Add rustfmt and clippy to the pinned toolchain
        timeout-minutes: 10
        run: |
          set -euo pipefail
          source scripts/ci/ci-retry.sh
          rustup_bin="${CARGO_HOME}/bin/rustup"
          test -x "${rustup_bin}" || rustup_bin="$(command -v rustup)"
          ci_retry rustup-component-add "${rustup_bin}" component add \
            --toolchain "${RUSTUP_TOOLCHAIN}" rustfmt clippy
          cargo fmt --version
          cargo clippy --version

      - name: Check launcher formatting
        run: cargo fmt --manifest-path clients/native/Cargo.toml --all -- --check

      - name: Test the launcher crate
        timeout-minutes: 15
        run: cargo test --manifest-path clients/native/Cargo.toml -p hyprial-shell-launcher --locked

      - name: Lint the launcher crate
        timeout-minutes: 15
        run: cargo clippy --manifest-path clients/native/Cargo.toml -p hyprial-shell-launcher --locked --all-targets -- -D warnings

      - name: Record end CI conditions
        if: always()
        run: bash scripts/ci/ci-conditions.sh end

      - name: Upload CI conditions artifact
        id: ci_conditions_artifact
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v3
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          http_proxy: ""
          https_proxy: ""
        with:
          name: ci-conditions-${{ github.job }}
          path: ${{ runner.temp }}/ci-conditions-${{ github.job }}.txt
          if-no-files-found: error

      - name: Report CI conditions artifact upload failure
        if: always() && steps.ci_conditions_artifact.outcome == 'failure'
        run: bash scripts/ci/ci-conditions.sh artifact
