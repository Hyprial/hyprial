# Stable installer entrypoints: Forgejo -> R2, independent of wheel releases.
name: release-install-scripts
on:
  push:
    branches: [dev]
    paths:
      - install.sh
      - install.ps1
      - scripts/ci/publish_installers.py
      - scripts/ci/r2_upload.py
      - .forgejo/workflows/release-install-scripts.yml
  workflow_dispatch:

concurrency:
  group: public-install-scripts
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HTTPS_PROXY: http://host.docker.internal:7896
      HTTP_PROXY: http://host.docker.internal:7896
      NO_PROXY: localhost,127.0.0.1,::1,tailscale,forgejo-tailscale,.ts.net,.internal.hyprial.com,code.hyprial.com
      UV_HTTP_TIMEOUT: "60"
      UV_HTTP_RETRIES: "10"
    steps:
      - name: Check out event SHA and record start CI conditions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/dev || { echo 'Installer publication requires dev'; exit 1; }
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}.git"
          GIT_TERMINAL_PROMPT=0 \
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL%/}/.extraHeader" \
          GIT_CONFIG_VALUE_0="Authorization: token ${GITHUB_TOKEN}" \
            timeout 120 git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          bash scripts/ci/ci-conditions.sh start

      - name: Ensure pinned uv
        timeout-minutes: 4
        run: |
          # Force the existing checksum-verified path even without a runner cache.
          CI_CACHE_ROOT="${CI_CACHE_ROOT:-${RUNNER_TEMP}/installer-tool-cache}" \
            UV_VERSION=0.11.7 bash scripts/ci/ci-ensure-uv.sh

      - name: Publish installers and verify anonymous read-back
        env:
          # Keep R2/public read-back direct; dependency downloads retain the proxy.
          NO_PROXY: localhost,127.0.0.1,::1,tailscale,forgejo-tailscale,.ts.net,.internal.hyprial.com,code.hyprial.com,.r2.cloudflarestorage.com,dl.hyprial.com
          no_proxy: localhost,127.0.0.1,::1,tailscale,forgejo-tailscale,.ts.net,.internal.hyprial.com,code.hyprial.com,.r2.cloudflarestorage.com,dl.hyprial.com
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run --no-project --python 3.12 python scripts/ci/publish_installers.py

      - name: Record end CI conditions
        if: always()
        run: bash scripts/ci/ci-conditions.sh end

      - name: Upload CI conditions artifact
        id: ci_conditions_artifact
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v3
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          http_proxy: ""
          https_proxy: ""
        with:
          name: ci-conditions-${{ github.job }}
          path: ${{ runner.temp }}/ci-conditions-${{ github.job }}.txt
          if-no-files-found: error

      - name: Report CI conditions artifact upload failure
        if: always() && steps.ci_conditions_artifact.outcome == 'failure'
        run: bash scripts/ci/ci-conditions.sh artifact

  drift:
    needs: [publish]
    if: always() && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HTTPS_PROXY: http://host.docker.internal:7896
      HTTP_PROXY: http://host.docker.internal:7896
      NO_PROXY: localhost,127.0.0.1,::1,tailscale,forgejo-tailscale,.ts.net,.internal.hyprial.com,code.hyprial.com
      UV_HTTP_TIMEOUT: "60"
      UV_HTTP_RETRIES: "10"
    steps:
      - name: Check out event SHA and record start CI conditions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}.git"
          GIT_TERMINAL_PROMPT=0 \
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL%/}/.extraHeader" \
          GIT_CONFIG_VALUE_0="Authorization: token ${GITHUB_TOKEN}" \
            timeout 120 git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          bash scripts/ci/ci-conditions.sh start

      - name: Ensure pinned uv
        timeout-minutes: 4
        run: |
          CI_CACHE_ROOT="${CI_CACHE_ROOT:-${RUNNER_TEMP}/installer-tool-cache}" \
            UV_VERSION=0.11.7 bash scripts/ci/ci-ensure-uv.sh

      # No R2 secrets or S3 calls: this step also works on a plain checkout.
      - name: Compare public installer objects with repo bytes
        env:
          NO_PROXY: localhost,127.0.0.1,::1,tailscale,forgejo-tailscale,.ts.net,.internal.hyprial.com,code.hyprial.com,.r2.cloudflarestorage.com,dl.hyprial.com
          no_proxy: localhost,127.0.0.1,::1,tailscale,forgejo-tailscale,.ts.net,.internal.hyprial.com,code.hyprial.com,.r2.cloudflarestorage.com,dl.hyprial.com
        run: uv run --no-project --python 3.12 python scripts/ci/publish_installers.py --check

      - name: Record end CI conditions
        if: always()
        run: bash scripts/ci/ci-conditions.sh end

      - name: Upload CI conditions artifact
        id: ci_conditions_artifact
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v3
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          http_proxy: ""
          https_proxy: ""
        with:
          name: ci-conditions-${{ github.job }}
          path: ${{ runner.temp }}/ci-conditions-${{ github.job }}.txt
          if-no-files-found: error

      - name: Report CI conditions artifact upload failure
        if: always() && steps.ci_conditions_artifact.outcome == 'failure'
        run: bash scripts/ci/ci-conditions.sh artifact
