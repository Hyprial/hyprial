# Calibration: does the fake provider still match the real one?
#
# This does not test the product. It answers whether the local provider fake
# has drifted from the service it imitates -- a different question, with a
# different owner and a different urgency. The E2E line's correctness rests on
# that resemblance, and nothing in a mock announces when it has fallen behind.
#
# Deliberately a standalone workflow rather than a job inside e2e-controlled:
# that workflow's recent history is a run of failures with no notification
# step anywhere in it, and it commonly fails 8-13 minutes in. A report placed
# there would be generated late, if at all, into somewhere nobody is watching
# -- the exact failure this whole line of work exists to remove.
#
# Credential model: the same shape as e2e-controlled -- repository secrets,
# and a preflight that refuses loudly rather than proceeding degraded.
# ⚠️ But NOT the same secrets. Calibration compares OpenAI/Anthropic response
# shapes and never touches Lark, so no Lark App credential is injected here at
# all. Handing a job credentials it has no use for is its own defect, and the
# production Apps stay a red line by not being reachable from this workflow
# rather than by being checked for.
#
# Triggers are events that already happen; there is deliberately no schedule.
# A periodic job with no owner rots, and this repository has the evidence:
# the scheduled runs next door have been failing unattended.
name: e2e-provider-calibration

on:
  push:
    tags:
      - "v*"
    paths:
      - "uv.lock"
      - "pyproject.toml"
      - "contract/e2e/_fake_provider.py"
      - "contract/e2e/_calibration.py"
  workflow_dispatch:

concurrency:
  group: provider-calibration
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: macos-host
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Checkout the exact commit
        run: |
          set -euo pipefail
          git init -q .
          # macos-host runs ON the host: ${GITHUB_SERVER_URL} names the
          # container-only host-gateway `tailscale`, which does not resolve
          # here (measured 2026-09-15, curl --noproxy => rc=6; every recent
          # calibrate run died at this fetch). The host reaches the instance
          # over the tailnet directly.
          git remote add origin "http://git.internal.hyprial.com:3000/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD
          bash scripts/ci/ci-conditions.sh start

      - name: Preflight
        run: |
          set -euo pipefail
          # Refuse loudly rather than producing a report that silently
          # compared the fake against nothing.
          test -n "${DEEPSEEK_API_KEY}" \
            || { echo "REFUSING: DEEPSEEK_API_KEY is not injected; a calibration without the real side is not a calibration" >&2; exit 1; }
          # The red line, asserted by absence: this job must not be able to
          # reach a Lark App at all.
          for leaked in HYPRIAL_E2E_LARK_APP_ID HYPRIAL_E2E_LARK_APP_SECRET HYPRIAL_E2E_LARK_CHAT_ID; do
            if [ -n "${!leaked:-}" ]; then
              echo "REFUSING: ${leaked} is injected into calibration, which has no use for it" >&2
              exit 1
            fi
          done
          command -v uv >/dev/null || { echo "uv is missing on this host" >&2; exit 1; }

      - name: Compare the fake against the real provider
        run: |
          set -euo pipefail
          uv run --locked --python 3.12 --extra test \
            python contract/e2e/run-provider-calibration.py \
            | tee calibration-report.txt

      - name: Record that this run happened
        if: always()
        run: |
          set -uo pipefail
          # Written by CI, never by whoever collects the report -- a collector
          # cannot record "I failed to collect" because it does not know
          # anything existed. This line is the only thing separating "never
          # ran" from "ran and the report was lost", and those must not look
          # alike.
          #
          # Lives outside ~/.hyprial deliberately: that tree is hyprial's own state and
          # gets reset. A record used to detect loss must not sit where it can
          # be lost with the thing it describes.
          trace_dir="${HOME}/.hyprial-ops/calibration"
          mkdir -p "${trace_dir}"

          report="calibration-report.txt"
          if [ -s "${report}" ]; then
            digest="$(shasum -a 256 "${report}" | cut -d' ' -f1)"
            if grep -q '^no drift' "${report}"; then
              status="ran-ok"
            else
              status="drift-found"
            fi
            path="$(cd "$(dirname "${report}")" && pwd)/$(basename "${report}")"
          else
            # Third state, never folded into ran-ok: being unable to look is
            # not the same as having looked and found nothing.
            status="did-not-run"
            digest="-"
            path="-"
          fi

          # One short line, O_APPEND: well under PIPE_BUF, so concurrent
          # appends cannot interleave into a torn record.
          printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${GITHUB_RUN_ID}" "${GITHUB_SHA}" \
            "${status}" "${path}" "${digest}" \
            >> "${trace_dir}/runs.tsv"
          echo "recorded: ${status}"

      - name: Publish the report
        if: always()
        run: |
          set -euo pipefail
          # The report is the deliverable. Printing it into a job log is not
          # delivery -- see the note at the top about signals nobody reads.
          # Delivery is wired on the host side, driven by the trace above; this
          # step states plainly that the report has NOT been delivered from
          # here, rather than letting a log line imply it reached someone.
          echo "--- calibration report ---"
          cat calibration-report.txt || echo "(no report produced)"
          echo "--- NOT DELIVERED FROM CI: collection is host-side; see ~/.hyprial-ops/calibration/runs.tsv ---"

      - name: Record end CI conditions
        if: always()
        run: bash scripts/ci/ci-conditions.sh end

      - name: Upload CI conditions artifact
        id: ci_conditions_artifact
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v3
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          http_proxy: ""
          https_proxy: ""
        with:
          name: ci-conditions-${{ github.job }}
          path: ${{ runner.temp }}/ci-conditions-${{ github.job }}.txt
          if-no-files-found: error

      - name: Report CI conditions artifact upload failure
        if: always() && steps.ci_conditions_artifact.outcome == 'failure'
        run: bash scripts/ci/ci-conditions.sh artifact
