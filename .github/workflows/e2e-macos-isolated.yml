# Isolated macOS E2E gate. Unit tests run in the ubuntu-latest container workflow.
#
# Credential-free real-environment scenarios E2E-001 (Docker mode) and the
# automated portion of E2E-011 plus isolated E2E-009/015/016/017 run here.
# E2E-009 is credential-free: it proves a clean first run creates no agent,
# adapter, route or pin.
# Scenarios needing controlled
# credentials or a dedicated service — E2E-004, E2E-006, E2E-008,
# E2E-012, E2E-013 — run in e2e-macos-credentialed.yml on this same host.
# Deliberately NOT automated anywhere (attended only):
#   - E2E-001 [REAL ENV] two-Tailnet-host form: needs two physical hosts
#     reaching each other over the Harness transport.
#   - E2E-011 steps 14-15: the platform requires a human to approve App
#     creation (device authorization) and a tenant admin to grant scopes.
# Their absence from CI is a declared exclusion, never a PASS; do not add a
# skip that masks them.

name: e2e-macos-isolated
on:
  workflow_dispatch:
  # Release signal, NOT a release blocker: pushing a version tag runs this
  # gate automatically so a red is always visible — but nothing prevents a
  # red gate's tag from shipping.  That is the deliberate current state
  # (Allen ruling C on #130: signal, not enforcement).  Do not read this
  # comment as evidence that a blocking gate exists; building one is #130's
  # follow-up if the ruling changes.
  push:
    tags:
      - "v*"
  schedule:
    - cron: "17 18 * * *"

jobs:
  isolated-macos:
    # runs-on: macos-host — the Forgejo runner labelled `macos-host:host`
    # (~/.forgejo-runner/config.yaml).  The `:host` suffix means jobs execute
    # directly on this Mac, NOT in a container: the claude / codex / pi /
    # lark-cli login state these scenarios need lives on the host itself
    # (see the credential model above).
    #
    # ⚠️ That runner is kept alive by launchd
    # (~/Library/LaunchAgents/com.hyprial.harness-bridge-release-runner.plist,
    # KeepAlive=true).  Removing that unit, or "containerising the last native
    # runner" during infra cleanup, silently takes BOTH E2E gates offline —
    # Forgejo can only observe that the runner went away; it has no agent on
    # this machine to restart it.  Containerising it is not an option: doing so
    # is exactly what `:host` exists to avoid.
    runs-on: macos-host
    timeout-minutes: 90
    env:
      HYPRIAL_E2E_ROOT: /tmp/hyprial-e2e-${{ github.run_id }}
      HYPRIAL_HOME: /tmp/hyprial-e2e-${{ github.run_id }}/home
      HARNESS_STATE_DIR: /tmp/hyprial-e2e-${{ github.run_id }}/state
      # #361: a node must have an owner (HYPRIAL_OWNER > settings.json owner >
      # refuse).  IsolatedDaemon sets its own; this covers the runners that
      # spawn `hyprial init` themselves with an inherited env (uv-install-flow,
      # feishu-roundtrip, pi-wake-registration, tui-attach-manual,
      # codex-app-server).  The CI login has no settings.json.
      HYPRIAL_OWNER: e2e
      # Defense in depth: no scenario in this credential-free gate should
      # spawn a real claude (E2E-010 uses a fake launcher), but if one ever
      # does it must land on the CI-dedicated login, never the developer's
      # ~/.claude. Literal path: job-level env does no shell expansion.
      CLAUDE_CONFIG_DIR: /Users/ci-runner/.claude-ci
      # The runner is launched by launchd and inherits no shell proxy, so uv's
      # wheel downloads hang on the PyPI CDN instead of failing: a stuck
      # `uv tool install` held run 624 for 22 minutes and left two-day-old
      # zombie workers behind it. Route package traffic through the local
      # proxy, keep intra-tailnet traffic direct, and cap every HTTP attempt so
      # a stall becomes a fast, visible failure rather than a silent hang.
      HTTPS_PROXY: http://127.0.0.1:7896
      HTTP_PROXY: http://127.0.0.1:7896
      NO_PROXY: localhost,127.0.0.1,::1,tailscale,forgejo-tailscale,100.64.0.0/10,.ts.net,.internal.hyprial.com,git.internal.hyprial.com,code.hyprial.com
      UV_HTTP_TIMEOUT: "60"
      UV_HTTP_RETRIES: "10"
    steps:
      - name: Check out commit
        run: |
          start=$(date +%s)
          if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then mkdir -p "${HYPRIAL_E2E_ROOT}/diag" 2>/dev/null || true; fi
          trap 'rc=$?; trace="/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv"; row="$(printf "%s\tcheckout\t%s\t%ss" "$(($(cat "$trace" 2>/dev/null | wc -l) + 1))" "$rc" "$(( $(date +%s) - start ))")"; printf "%s\n" "$row" >> "$trace" 2>/dev/null || true; if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then printf "%s\n" "$row" >> "${HYPRIAL_E2E_ROOT}/diag/steps.tsv" 2>/dev/null || true; fi; exit "$rc"' EXIT
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          # macos-host runs ON the host, where the container-only host-gateway
          # name `tailscale` does not resolve (measured 2026-09-15: curl
          # --noproxy '*' http://tailscale:3000/ => rc=6). The host is on the
          # tailnet and reaches the instance directly; measured:
          # `git ls-remote http://git.internal.hyprial.com:3000/HyprialOS/harness-bridge.git`
          # => rc=0. Do not "simplify" this back to ${GITHUB_SERVER_URL}.
          git remote add origin "http://git.internal.hyprial.com:3000/${GITHUB_REPOSITORY}.git"
          # E2E-005/010 exercise git push/upgrade flows from this checkout;
          # a shallow clone makes those pushes fail with "shallow update not
          # allowed", so fetch full history unlike the unit-test workflow.
          git fetch origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          bash scripts/ci/ci-conditions.sh start

      - name: Ensure uv
        run: |
          start=$(date +%s)
          if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then mkdir -p "${HYPRIAL_E2E_ROOT}/diag" 2>/dev/null || true; fi
          trap 'rc=$?; trace="/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv"; row="$(printf "%s\tensure-uv\t%s\t%ss" "$(($(cat "$trace" 2>/dev/null | wc -l) + 1))" "$rc" "$(( $(date +%s) - start ))")"; printf "%s\n" "$row" >> "$trace" 2>/dev/null || true; if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then printf "%s\n" "$row" >> "${HYPRIAL_E2E_ROOT}/diag/steps.tsv" 2>/dev/null || true; fi; exit "$rc"' EXIT
          set -o pipefail
          # Tier order host -> cache -> installer lives in the shared script, which
          # prints the tier it used; that line is the evidence for whether a live
          # fetch happened.  (Host-first, infra-ops 2026-09-28: run 11597 went red
          # here before any scenario ran, because the proxy's exit node timed out
          # for every destination for ~70 s and this step fetched uv from astral.sh.)
          UV_VERSION=0.11.7 UV_BIN_DIR="/tmp/hyprial-e2e-uv-${GITHUB_RUN_ID}" \
            bash scripts/ci/ci-ensure-uv.sh

      - name: Prepare isolated runtime
        run: |
          start=$(date +%s)
          if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then mkdir -p "${HYPRIAL_E2E_ROOT}/diag" 2>/dev/null || true; fi
          trap 'rc=$?; trace="/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv"; row="$(printf "%s\tprepare\t%s\t%ss" "$(($(cat "$trace" 2>/dev/null | wc -l) + 1))" "$rc" "$(( $(date +%s) - start ))")"; printf "%s\n" "$row" >> "$trace" 2>/dev/null || true; if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then printf "%s\n" "$row" >> "${HYPRIAL_E2E_ROOT}/diag/steps.tsv" 2>/dev/null || true; fi; exit "$rc"' EXIT
          # Empty-value guard first: the != test below passes when HYPRIAL_HOME is
          # UNSET, silently relocating the "isolated" home to $HOME/.hyprial.
          # HARNESS_STATE_DIR gets the same guard — it silently overrides
          # HYPRIAL_HOME-derived state placement, so it must be set explicitly.
          # NOTE: explicit if/exit, not ${X:?} — under an EXIT trap, bash 3.2
          # (the runner shell) reports expansion-error deaths as rc=0, which
          # would mark this step GREEN on failure.
          if [ -z "${HYPRIAL_HOME:-}" ]; then echo "HYPRIAL_HOME must be set to a dedicated E2E home" >&2; exit 1; fi
          if [ -z "${HARNESS_STATE_DIR:-}" ]; then echo "HARNESS_STATE_DIR must be set to a dedicated E2E state dir" >&2; exit 1; fi
          test "${HYPRIAL_HOME}" != "${HOME}/.hyprial"
          mkdir -p "${HYPRIAL_HOME}" "${HARNESS_STATE_DIR}" "${HYPRIAL_E2E_ROOT}/diag"
          chmod 700 "${HYPRIAL_E2E_ROOT}" "${HYPRIAL_HOME}" "${HARNESS_STATE_DIR}"
          # #131④: from here everything is both in the job log AND on disk
          # under diag/ — the job log is unreadable post-hoc (no artifact
          # mirror on this instance), while diag/ survives a failed run
          # because the cleanup below is success()-only.  set -x included.
          exec > >(tee "${HYPRIAL_E2E_ROOT}/diag/preflight.txt") 2>&1
          set -x
          uv lock --check
          # --compile-bytecode: the first daemon a scenario starts must not
          # compile hyprial and its deps inside `hyprial init`'s readiness
          # wait (2026-09-27: E2E-002/004/006 DAEMON_START_TIMEOUT under load).
          # The runner is started by launchd, whose default soft RLIMIT_NOFILE
          # is 256 (`launchctl limit maxfiles`: 256 / unlimited, 2026-09-28).
          # --compile-bytecode starts interpreters in parallel and hit
          # "Too many open files (os error 24)" in run 11604. Raise the soft
          # limit for THIS step's shell only: later steps, where the product's
          # own fd behaviour is exercised, keep the runner's limit unchanged.
          ulimit -S -n 65536 || ulimit -S -n "$(ulimit -H -n)"
          ulimit -S -n
          uv sync --locked --python 3.12 --extra test --compile-bytecode
          uname -a
          uv run --locked --python 3.12 python - <<'PY'
          import os
          import sys

          print(f"python.executable={sys.executable}")
          print(f"python.version={sys.version}")
          print(f"HYPRIAL_HOME={os.environ['HYPRIAL_HOME']}")
          print(f"HARNESS_STATE_DIR={os.environ['HARNESS_STATE_DIR']}")
          PY
          "$(pwd)/.venv/bin/hyprial" version --json

      - name: Prepare the pinned isolated Rust toolchain for native E2E wheels
        timeout-minutes: 20
        run: |
          set -euo pipefail
          bash scripts/ci/ci-ensure-rust.sh

      - name: Build the candidate Tailcat for the installation scenario
        run: |
          set -euo pipefail
          bin="${HYPRIAL_E2E_ROOT}/bin"
          mkdir -p "$bin"
          export CI_CACHE_ROOT="${CI_CACHE_ROOT:-${GITHUB_WORKSPACE}/.ci-cache}"
          export GO_ROOT_DIR="${HYPRIAL_E2E_ROOT}/toolchain"
          export GOCACHE="${CI_CACHE_ROOT}/e2e/go-build"
          export GOMODCACHE="${CI_CACHE_ROOT}/e2e/go-mod"
          export GOPATH="${CI_CACHE_ROOT}/e2e/go-path"
          export GOTOOLCHAIN=local
          export GOPROXY="https://goproxy.cn|https://proxy.golang.org"
          GO_VERSION=1.27.1 bash scripts/ci/ci-ensure-go.sh
          export PATH="${GO_ROOT_DIR}/go/bin:$PATH"
          cd sidecar/hyprial-tailcat
          CGO_ENABLED=0 go build -mod=readonly -trimpath -o "$bin/hyprial-tailcat" ./cmd/hyprial-tailcat
          test -x "$bin/hyprial-tailcat"
          printf 'HYPRIAL_TAILCAT_BINARY=%s\n' "$bin/hyprial-tailcat" >> "$GITHUB_ENV"

      - name: Validate E2E scenario inventory
        run: |
          start=$(date +%s)
          set +e
          uv run --locked --python 3.12 python contract/e2e/validate.py 2>&1 \
            | tee "${HYPRIAL_E2E_ROOT}/diag/validate.log"
          rc=${PIPESTATUS[0]}
          set -e
          row="$(printf '%s\tvalidate\t%s\t%ss' "$(($(cat "/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv" 2>/dev/null | wc -l) + 1))" "$rc" "$(( $(date +%s) - start ))")"
          printf '%s\n' "$row" >> "/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv" || true
          printf '%s\n' "$row" >> "${HYPRIAL_E2E_ROOT}/diag/steps.tsv"
          exit "$rc"

      # Periodic assumption check (owner 2026-11-10): before any scenario runs,
      # prove the mapping in contract/e2e/scenarios.json is still true — every
      # runner/document exists, every covers pattern still matches a tracked
      # file, and every declared dependency still parses.  It compares nothing
      # and reads no base: this gate answers "are the assumptions still valid",
      # not "what changed".  Scheduled runs only; a red here means someone must
      # update the scenario registry, not that a product behaviour failed.
      - name: E2E assumptions still hold
        if: github.event_name == 'schedule'
        run: |
          set -o pipefail
          mkdir -p "${HYPRIAL_E2E_ROOT}/diag"
          uv run --locked --python 3.12 python scripts/ci/check_e2e_impact.py \
            --repo . --validate-only \
            | tee "${HYPRIAL_E2E_ROOT}/diag/e2e-assumptions.json"

      # One driver step, not twelve sequential ones: E2E-001 red used to
      # mean E2E-002..E2E-020 never ran, so a red gate produced NO reading
      # for the scenarios it was supposed to gate (spec-e2e001, 2026-09-14).
      # The scenario loop lives in the runner layer (hq-adjutant ruling:
      # ⛔ no continue-on-error, ⛔ no if:always() on workflow steps) — every
      # scenario runs, each prints its own RESULT lines into diag/E2E-NNN.log
      # and steps.tsv, and the driver exits 1 when ANY scenario fails.  Later
      # greens cannot dilute an earlier red; dependent scenarios are SKIPped
      # as 前置失败 instead of running into a half-dead environment.
      - name: E2E scenarios (isolated gate loop)
        env:
          HYPRIAL_BIN: ${{ github.workspace }}/.venv/bin/hyprial
          # CI-load headroom for `hyprial init`'s readiness wait (product
          # default 15 s). A hung daemon still fails, at 45 s.
          HYPRIAL_INIT_READY_TIMEOUT: "45"
        run: |
          start=$(date +%s)
          if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then mkdir -p "${HYPRIAL_E2E_ROOT}/diag" 2>/dev/null || true; fi
          trap 'rc=$?; trace="/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv"; row="$(printf "%s\tE2E-gate\t%s\t%ss" "$(($(cat "$trace" 2>/dev/null | wc -l) + 1))" "$rc" "$(($(date +%s) - start))")"; printf "%s\n" "$row" >> "$trace" 2>/dev/null || true; if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then printf "%s\n" "$row" >> "${HYPRIAL_E2E_ROOT}/diag/steps.tsv" 2>/dev/null || true; fi; exit "$rc"' EXIT
          uv run --locked --python 3.12 python contract/e2e/run-isolated-gate.py

      - name: Collect E2E failure artifacts
        # Scenario runners may preserve a failed run's state root (daemon.jsonl,
        # daemon-launch.log, inbox.sqlite3, ...) under
        # ${HYPRIAL_E2E_ROOT}/artifacts — via _daemon_runner.preserve_failure_state
        # or, for E2E-001 since #131⑤, artifacts_root() in capture_failure.
        # (The old text claimed every scenario wrote here; that was never true
        # and actively misled readers — E2E-001's evidence sat in /tmp all
        # along.  Corrected in #131⑤.)
        # actions/upload-artifact@v3 works only on the Linux container
        # runners (the unit jobs upload pytest-groups-unit and
        # ci-conditions-unit there), never on this macos-host runner -- which
        # is why the ci-conditions upload at the end of this job is
        # continue-on-error.  For these E2E scenarios, the run-scoped host
        # directory is their artifact store.
        # This step prints the inventory into the job log so a red run shows whether
        # evidence was captured.  Added after run 857's E2E-002 flake left
        # no post-mortem at all (TemporaryDirectory cleanup deleted it).
        if: always()
        run: |
          start=$(date +%s)
          if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then mkdir -p "${HYPRIAL_E2E_ROOT}/diag" 2>/dev/null || true; fi
          trap 'rc=$?; trace="/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv"; row="$(printf "%s\tcollect-artifacts\t%s\t%ss" "$(($(cat "$trace" 2>/dev/null | wc -l) + 1))" "$rc" "$(( $(date +%s) - start ))")"; printf "%s\n" "$row" >> "$trace" 2>/dev/null || true; if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then printf "%s\n" "$row" >> "${HYPRIAL_E2E_ROOT}/diag/steps.tsv" 2>/dev/null || true; fi; exit "$rc"' EXIT
          mkdir -p "${HYPRIAL_E2E_ROOT}/diag"
          ARTIFACTS="${HYPRIAL_E2E_ROOT}/artifacts"
          if [ -d "$ARTIFACTS" ]; then
            echo "E2E failure artifacts at $ARTIFACTS:"
            find "$ARTIFACTS" -type f | sort
          else
            echo "no E2E failure artifacts preserved this run"
          fi
          # #131④: per-step diagnostics live in the sibling diag/ directory
          # (NEVER inside artifacts/ — a collector that copies or finds the
          # root into itself is the #68 self-copy trap).
          DIAG="${HYPRIAL_E2E_ROOT}/diag"
          if [ -d "$DIAG" ]; then
            echo "E2E step diagnostics at $DIAG:"
            find "$DIAG" -type f | sort
            echo "--- steps.tsv ---"
            cat "$DIAG/steps.tsv" 2>/dev/null || true
          fi
          # #131⑤: E2E-001's pre-⑤ evidence channel is /tmp/hyprial-e2e001-*
          # — OUTSIDE HYPRIAL_E2E_ROOT, so CI cleanup never sweeps it (and must
          # not: #69 owns host-level age reclamation; the 9 existing dirs
          # are evidence for the ongoing gate-red investigation).  Point at
          # the recent ones READ-ONLY so a red run never again reads as
          # "no evidence" while evidence sits in /tmp; new CI failures land
          # in artifacts/ directly (E2E-001 now honors artifacts_root()).
          LEGACY="$(ls -dt /tmp/hyprial-e2e001-failure-* /tmp/hyprial-e2e001-evidence-* 2>/dev/null | head -5 || true)"
          if [ -n "$LEGACY" ]; then
            {
              echo "legacy E2E-001 evidence dirs (outside run root; never swept by CI):"
              echo "$LEGACY"
            } | tee "$DIAG/legacy-evidence.txt"
          fi

      - name: E2E verdict summary (step / rc / first failure line)
        # Run 1530 lesson: the E2E-003 red was diagnosable only by opening
        # steps.tsv and the per-scenario log by hand — four trees shared one
        # "signature" until the rc/duration shape differences were read.
        # This step folds that first hop into the job summary: one row per
        # steps.tsv entry, and for red steps the first RESULT FAIL (or
        # ok:false JSON) line from the matching diag log.  Purely
        # informational — it must never fail the job.
        if: always()
        run: |
          DIAG="${HYPRIAL_E2E_ROOT:-/nonexistent}/diag"
          SUMMARY="$(mktemp)"
          {
            echo "## E2E verdict"
            echo ""
            if [ -f "$DIAG/steps.tsv" ]; then
              echo "| step | rc | took | first failure line |"
              echo "|---|---|---|---|"
              while IFS="$(printf '\t')" read -r _seq step rc took; do
                [ -n "${step:-}" ] || continue
                detail=""
                if [ "${rc:-0}" != "0" ] && [ -f "$DIAG/$step.log" ]; then
                  detail="$(grep -m1 -E 'RESULT FAIL|"ok": ?false' "$DIAG/$step.log" 2>/dev/null | head -c 300 | tr '|' '/')"
                fi
                echo "| $step | ${rc:-?} | ${took:-?} | $detail |"
              done < "$DIAG/steps.tsv"
            else
              echo "no steps.tsv recorded (run died before the first step trap)"
            fi
          } > "$SUMMARY" || true
          cat "$SUMMARY"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY" || true
          fi
          exit 0

      - name: Sweep Docker leftovers (hyprial-e2e001-*)
        # The E2E-001 runner removes its own containers/network/volumes even
        # on failure and Ctrl-C, but a SIGKILL or job-timeout kills the
        # process before its finally runs.  This sweep is the CI-level
        # backstop for exactly that path: it removes anything the runner
        # could not, then FAILS LOUDLY if anything remains — a leak must
        # surface as a red run, never as silent disk growth on the host.
        # Images are the runner's business now: it reuses hyprial-e2e001:local
        # only while its hyprial.e2e001.inputs label matches the tested tree
        # and keeps the newest two labeled images (spec-e2e001 追加 1), so NO
        # image prune here — pruning dangling labeled images would erase the
        # retained pair the reuse policy exists to keep.
        if: always()
        run: |
          start=$(date +%s)
          if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then mkdir -p "${HYPRIAL_E2E_ROOT}/diag" 2>/dev/null || true; fi
          trap 'rc=$?; trace="/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv"; row="$(printf "%s\tdocker-sweep\t%s\t%ss" "$(($(cat "$trace" 2>/dev/null | wc -l) + 1))" "$rc" "$(( $(date +%s) - start ))")"; printf "%s\n" "$row" >> "$trace" 2>/dev/null || true; if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then printf "%s\n" "$row" >> "${HYPRIAL_E2E_ROOT}/diag/steps.tsv" 2>/dev/null || true; fi; exit "$rc"' EXIT
          set -u
          rc=0
          containers=$(docker ps -aq --filter name=hyprial-e2e001 || true)
          if [ -n "$containers" ]; then
            echo "sweeping leftover containers: $containers"
            # shellcheck disable=SC2086
            docker rm -f $containers || rc=1
          fi
          networks=$(docker network ls -q --filter name=hyprial-e2e001 || true)
          if [ -n "$networks" ]; then
            echo "sweeping leftover networks: $networks"
            # shellcheck disable=SC2086
            docker network rm $networks || rc=1
          fi
          volumes=$(docker volume ls -q --filter label=hyprial-e2e001=1 || true)
          if [ -n "$volumes" ]; then
            echo "sweeping leftover volumes: $volumes"
            # shellcheck disable=SC2086
            docker volume rm $volumes || rc=1
          fi
          remaining="$(docker ps -aq --filter name=hyprial-e2e001 || true)"
          remaining="$remaining $(docker network ls -q --filter name=hyprial-e2e001 || true)"
          remaining="$remaining $(docker volume ls -q --filter label=hyprial-e2e001=1 || true)"
          if [ -n "$(echo "$remaining" | tr -d ' \n')" ]; then
            echo "LEAK: hyprial-e2e001 resources survived the sweep:$remaining" >&2
            exit 1
          fi
          exit "$rc"

      - name: Clean isolated runtime
        # success()-only by contract (task #131): on a FAILED run the
        # run-scoped root IS the artifact store (see "Collect E2E failure
        # artifacts" above — for these E2E scenarios the run-scoped host
        # directory is the artifact store).  Deleting it on the failure path
        # would erase the evidence the previous step just inventoried.  Failed roots are
        # left on disk and reclaimed by the host-level age sweep (#69), including the diag/ step diagnostics (#131④).
        if: success()
        run: |
          start=$(date +%s)
          if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then mkdir -p "${HYPRIAL_E2E_ROOT}/diag" 2>/dev/null || true; fi
          trap 'rc=$?; trace="/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv"; row="$(printf "%s\tcleanup\t%s\t%ss" "$(($(cat "$trace" 2>/dev/null | wc -l) + 1))" "$rc" "$(( $(date +%s) - start ))")"; printf "%s\n" "$row" >> "$trace" 2>/dev/null || true; if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then printf "%s\n" "$row" >> "${HYPRIAL_E2E_ROOT}/diag/steps.tsv" 2>/dev/null || true; fi; exit "$rc"' EXIT
          case "${HYPRIAL_E2E_ROOT}" in
            /tmp/hyprial-e2e-*) rm -rf -- "${HYPRIAL_E2E_ROOT}" ;;
            *) echo "refusing unsafe cleanup path: ${HYPRIAL_E2E_ROOT}" >&2; exit 1 ;;
          esac

      # Nightly promotion chain, writer half (contract, do not weaken):
      # this step is the ONLY writer of gate-e2e.json, it runs only when the
      # whole scheduled job is green (success() covers every scenario step),
      # and it never moves any tag itself.  release-nightly-promote.yml promotes ONLY
      # when gate-e2e.json and gate-e2e-controlled.json name the SAME sha,
      # both fresh from the same night — one green gate never promotes.
      - name: Record gate-green marker (scheduled runs only)
        if: success() && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MARKER="gate-e2e.json"
          work="$(mktemp -d)"
          cd "${work}"
          git init -q .
          # Host-side origin: see the checkout step above for why this is NOT
          # ${GITHUB_SERVER_URL}. Token rides in the step environment as a
          # URL-scoped extraHeader (this step ls-remote/fetch/pushes in a
          # retry loop), never in the remote URL.
          git remote add origin "http://git.internal.hyprial.com:3000/${GITHUB_REPOSITORY}.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.http://git.internal.hyprial.com:3000/.extraHeader"
          export GIT_CONFIG_VALUE_0="Authorization: token ${GITHUB_TOKEN}"
          git config user.name "hyprial-ci"
          git config user.email "ci@hyprial.invalid"
          if git ls-remote --exit-code origin refs/heads/ci/gate-status >/dev/null 2>&1; then
            git fetch --depth=1 origin ci/gate-status
            git checkout -q -B ci/gate-status FETCH_HEAD
          else
            git checkout -q --orphan ci/gate-status
          fi
          cat > "${MARKER}" <<EOF
          {"sha":"${GITHUB_SHA}","runId":"${GITHUB_RUN_ID}","workflow":"${GITHUB_WORKFLOW}","concludedAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","epoch":$(date -u +%s)}
          EOF
          git add "${MARKER}"
          git commit -q -m "ci(gate-status): ${GITHUB_WORKFLOW} green at ${GITHUB_SHA}"
          # The two gate workflows write disjoint files on one branch; a push
          # race is a non-fast-forward, cured by rebase (never force).
          for attempt in 1 2 3 4 5; do
            if git push -q origin ci/gate-status; then
              exit 0
            fi
            git fetch -q origin ci/gate-status
            git rebase -q "$(git rev-parse FETCH_HEAD)" || exit 1
          done
          echo "ci/gate-status push lost the race 5 times" >&2
          exit 1

      - name: Record end CI conditions
        if: always()
        run: bash scripts/ci/ci-conditions.sh end

      - name: Upload CI conditions artifact
        id: ci_conditions_artifact
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v3
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          http_proxy: ""
          https_proxy: ""
        with:
          name: ci-conditions-${{ github.job }}
          path: ${{ runner.temp }}/ci-conditions-${{ github.job }}.txt
          if-no-files-found: error

      - name: Report CI conditions artifact upload failure
        if: always() && steps.ci_conditions_artifact.outcome == 'failure'
        run: bash scripts/ci/ci-conditions.sh artifact
