# Controlled-credential macOS E2E gate for the real-environment scenarios the
# credential-free gate (e2e-macos-isolated.yml) cannot cover: E2E-004, E2E-006, E2E-008,
# E2E-012, E2E-013, E2E-025.  E2E-009 needs no credential and runs in
# e2e-macos-isolated.yml, so it never depends on this job's preflight.
#
# Credential model (see docs/notes/e2e-controlled-gate-plan.md):
#   - HYPRIAL_E2E_LARK_APP_ID / HYPRIAL_E2E_LARK_APP_SECRET: repository secrets for the
#     ONLY approved test App, allenwoods-hyprial-e2e (cli_aaf9ea19d4b8dbe4). The
#     production Apps (hq-adjutant-feishu, hyprial-kanban, mac-studio-feishu,
#     allen-squire) are a red line: the Preflight step refuses loudly when the
#     injected id is anything else, and the runners re-check independently.
#   - HYPRIAL_E2E_LARK_CHAT_ID: repository secret naming the App's shared test
#     group; feeds the runners' existing HYPRIAL_E2E_LARK_CHAT_ID override so no
#     production ~/.hyprial file is ever read.
#   - claude / codex / pi / lark-cli login state lives on this dedicated host
#     (v1, runbook-maintained); preflight fails red when any is missing.
# Isolation: every runner allocates disposable HYPRIAL_HOME/HARNESS_STATE_DIR and
# dynamic ports; nothing touches the production ~/.hyprial or port 7447.
# Exclusivity: E2E-004/013 must own the test App's event stream; this workflow
# is serialized by its concurrency group, and a colliding manual run surfaces
# as an environmental BLOCKED (red), never a silent pass.
# Discipline: scenario steps record the runner exit code (0=PASS, 1=FAIL,
# 2=BLOCKED, 3=NOT-RUN) and the Gate verdict step fails the job unless every
# gating scenario recorded PASS. Absence is not PASS; no skip masks a
# scenario.
# Layering (docs/notes/tui-test-layering.md): E2E-008 is the layer-2 real-TUI
# smoke (real claude starts, attaches, registers, exits).  It is GATING
# since 2026-08-19: the CC >=2.1.227 channel-contract break (#94) proved
# this smoke catches real regressions — it was red from the first run while
# three wrong attributions waved it away, and its CI form does not depend on
# reply delivery.  Standing rule: if it ever goes red again, a matching
# production signature means an incident gets filed; it must never be waived
# back to non-gating to buy quiet.  The deep protocol assertions live in
# fake-carrier contract tests (tests/daemon/sessions/test_session_carrier_protocol_contract.py).

name: e2e-macos-credentialed
on:
  workflow_dispatch:
  # Same current-state rationale as e2e-macos-isolated.yml: a version tag runs this gate too.
  # This gate also only signals; nothing here blocks a release (ruling C, #130).
  push:
    tags:
      - "v*"
  schedule:
    - cron: "47 19 * * *"

concurrency:
  group: e2e-controlled
  cancel-in-progress: false

jobs:
  controlled-real-env:
    # runs-on: macos-host — the Forgejo runner labelled `macos-host:host`
    # (~/.forgejo-runner/config.yaml).  The `:host` suffix means jobs execute
    # directly on this Mac, NOT in a container: the claude / codex / pi /
    # lark-cli login state these scenarios need lives on the host itself
    # (see the credential model above).
    #
    # ⚠️ That runner is kept alive by launchd
    # (~/Library/LaunchAgents/com.hyprial.harness-bridge-release-runner.plist,
    # KeepAlive=true).  Removing that unit, or "containerising the last native
    # runner" during infra cleanup, silently takes BOTH E2E gates offline —
    # Forgejo can only observe that the runner went away; it has no agent on
    # this machine to restart it.  Containerising it is not an option: doing so
    # is exactly what `:host` exists to avoid.
    runs-on: macos-host
    timeout-minutes: 120
    env:
      HYPRIAL_E2E_ROOT: /tmp/hyprial-e2e-controlled-${{ github.run_id }}
      HYPRIAL_HOME: /tmp/hyprial-e2e-controlled-${{ github.run_id }}/home
      HARNESS_STATE_DIR: /tmp/hyprial-e2e-controlled-${{ github.run_id }}/state
      # CI-dedicated Claude Code login (E2E-006/E2E-013 401 root-cause fix):
      # every claude process in this gate must use the CI-owned config dir,
      # never the developer's ~/.claude. Two config dirs sharing one OAuth
      # refresh token revoke each other on concurrent refresh; the runner
      # host therefore carries an independent login at ~/.claude-ci. Literal
      # path on purpose: job-level env does no shell expansion ($HOME would
      # NOT resolve), and runs-on is this host (macos-host).
      CLAUDE_CONFIG_DIR: /Users/ci-runner/.claude-ci
      # Same isolation for codex and pi (Allen 2026-09-26): the job used to
      # set only CLAUDE_CONFIG_DIR, so CI codex/pi workers ran on the
      # developer's real ~/.codex and ~/.pi and their credentials.  Since
      # #828 P1 workers inherit these roots.  ~/.codex-ci needs no
      # credential (codex+deepseek runs on the key in env; measured with an
      # empty CODEX_HOME); ~/.pi-ci/agent/auth.json holds the deepseek entry
      # only, provisioned by squire.  Literal paths, as above.
      CODEX_HOME: /Users/ci-runner/.codex-ci
      PI_CODING_AGENT_DIR: /Users/ci-runner/.pi-ci/agent
      HYPRIAL_E2E_LARK_APP_ID: ${{ secrets.HYPRIAL_E2E_LARK_APP_ID }}
      HYPRIAL_E2E_LARK_APP_SECRET: ${{ secrets.HYPRIAL_E2E_LARK_APP_SECRET }}
      HYPRIAL_E2E_LARK_CHAT_ID: ${{ secrets.HYPRIAL_E2E_LARK_CHAT_ID }}
      # Same launchd-no-proxy hazard as e2e-macos-isolated.yml (PR #158): uv wheel downloads
      # hang on the PyPI CDN without the local proxy; cap every HTTP attempt.
      HTTPS_PROXY: http://127.0.0.1:7896
      HTTP_PROXY: http://127.0.0.1:7896
      NO_PROXY: localhost,127.0.0.1,::1,tailscale,forgejo-tailscale,100.64.0.0/10,.ts.net,.internal.hyprial.com,git.internal.hyprial.com,code.hyprial.com
      UV_HTTP_TIMEOUT: "60"
      UV_HTTP_RETRIES: "10"
    steps:
      - name: Check out commit
        run: |
          start=$(date +%s)
          if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then mkdir -p "${HYPRIAL_E2E_ROOT}/diag" 2>/dev/null || true; fi
          trap 'rc=$?; trace="/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv"; row="$(printf "%s\tcheckout\t%s\t%ss" "$(($(cat "$trace" 2>/dev/null | wc -l) + 1))" "$rc" "$(( $(date +%s) - start ))")"; printf "%s\n" "$row" >> "$trace" 2>/dev/null || true; if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then printf "%s\n" "$row" >> "${HYPRIAL_E2E_ROOT}/diag/steps.tsv" 2>/dev/null || true; fi; exit "$rc"' EXIT
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          # macos-host runs ON the host, where the container-only host-gateway
          # name `tailscale` does not resolve (measured 2026-09-15: curl
          # --noproxy '*' http://tailscale:3000/ => rc=6). The host is on the
          # tailnet and reaches the instance directly; measured:
          # `git ls-remote http://git.internal.hyprial.com:3000/HyprialOS/harness-bridge.git`
          # => rc=0. Do not "simplify" this back to ${GITHUB_SERVER_URL}.
          git remote add origin "http://git.internal.hyprial.com:3000/${GITHUB_REPOSITORY}.git"
          git fetch origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          bash scripts/ci/ci-conditions.sh start

      - name: Ensure uv
        run: |
          start=$(date +%s)
          if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then mkdir -p "${HYPRIAL_E2E_ROOT}/diag" 2>/dev/null || true; fi
          trap 'rc=$?; trace="/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv"; row="$(printf "%s\tensure-uv\t%s\t%ss" "$(($(cat "$trace" 2>/dev/null | wc -l) + 1))" "$rc" "$(( $(date +%s) - start ))")"; printf "%s\n" "$row" >> "$trace" 2>/dev/null || true; if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then printf "%s\n" "$row" >> "${HYPRIAL_E2E_ROOT}/diag/steps.tsv" 2>/dev/null || true; fi; exit "$rc"' EXIT
          set -o pipefail
          # Tier order host -> cache -> installer lives in the shared script, which
          # prints the tier it used; that line is the evidence for whether a live
          # fetch happened.  (Host-first, infra-ops 2026-09-28: run 11597 went red
          # here before any scenario ran, because the proxy's exit node timed out
          # for every destination for ~70 s and this step fetched uv from astral.sh.)
          UV_VERSION=0.11.7 UV_BIN_DIR="/tmp/hyprial-e2e-uv-${GITHUB_RUN_ID}" \
            bash scripts/ci/ci-ensure-uv.sh

      - name: Prepare isolated runtime
        run: |
          start=$(date +%s)
          if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then mkdir -p "${HYPRIAL_E2E_ROOT}/diag" 2>/dev/null || true; fi
          trap 'rc=$?; trace="/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv"; row="$(printf "%s\tprepare\t%s\t%ss" "$(($(cat "$trace" 2>/dev/null | wc -l) + 1))" "$rc" "$(( $(date +%s) - start ))")"; printf "%s\n" "$row" >> "$trace" 2>/dev/null || true; if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then printf "%s\n" "$row" >> "${HYPRIAL_E2E_ROOT}/diag/steps.tsv" 2>/dev/null || true; fi; exit "$rc"' EXIT
          # Empty-value guard first: the != test below passes when HYPRIAL_HOME is
          # UNSET, silently relocating the "isolated" home to $HOME/.hyprial.
          # HARNESS_STATE_DIR gets the same guard — it silently overrides
          # HYPRIAL_HOME-derived state placement, so it must be set explicitly.
          # NOTE: explicit if/exit, not ${X:?} — under an EXIT trap, bash 3.2
          # (the runner shell) reports expansion-error deaths as rc=0, which
          # would mark this step GREEN on failure.
          if [ -z "${HYPRIAL_HOME:-}" ]; then echo "HYPRIAL_HOME must be set to a dedicated E2E home" >&2; exit 1; fi
          if [ -z "${HARNESS_STATE_DIR:-}" ]; then echo "HARNESS_STATE_DIR must be set to a dedicated E2E state dir" >&2; exit 1; fi
          test "${HYPRIAL_HOME}" != "${HOME}/.hyprial"
          mkdir -p "${HYPRIAL_HOME}" "${HARNESS_STATE_DIR}" "${HYPRIAL_E2E_ROOT}/diag"
          chmod 700 "${HYPRIAL_E2E_ROOT}" "${HYPRIAL_HOME}" "${HARNESS_STATE_DIR}"
          # #131④: from here everything is both in the job log AND on disk
          # under diag/ — the job log is unreadable post-hoc (no artifact
          # mirror on this instance), while diag/ survives a failed run
          # because the cleanup below is success()-only.  set -x included.
          exec > >(tee "${HYPRIAL_E2E_ROOT}/diag/preflight.txt") 2>&1
          set -x
          uv lock --check
          # --compile-bytecode: the first daemon a scenario starts must not
          # compile hyprial and its deps inside `hyprial init`'s readiness
          # wait (2026-09-27: E2E-002/004/006 DAEMON_START_TIMEOUT under load).
          # The runner is started by launchd, whose default soft RLIMIT_NOFILE
          # is 256 (`launchctl limit maxfiles`: 256 / unlimited, 2026-09-28).
          # --compile-bytecode starts interpreters in parallel and hit
          # "Too many open files (os error 24)" in run 11604. Raise the soft
          # limit for THIS step's shell only: later steps, where the product's
          # own fd behaviour is exercised, keep the runner's limit unchanged.
          ulimit -S -n 65536 || ulimit -S -n "$(ulimit -H -n)"
          ulimit -S -n
          uv sync --locked --python 3.12 --extra test --compile-bytecode
          "$(pwd)/.venv/bin/hyprial" version --json

      - name: Preflight (second-line defense, no secret values printed)
        run: |
          start=$(date +%s)
          if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then mkdir -p "${HYPRIAL_E2E_ROOT}/diag" 2>/dev/null || true; fi
          trap 'rc=$?; trace="/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv"; row="$(printf "%s\tpreflight-controlled\t%s\t%ss" "$(($(cat "$trace" 2>/dev/null | wc -l) + 1))" "$rc" "$(( $(date +%s) - start ))")"; printf "%s\n" "$row" >> "$trace" 2>/dev/null || true; if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then printf "%s\n" "$row" >> "${HYPRIAL_E2E_ROOT}/diag/steps.tsv" 2>/dev/null || true; fi; exit "$rc"' EXIT
          set -e
          mkdir -p "${HYPRIAL_E2E_ROOT}/results"
          # #131④: preflight output also lands on disk (diag/ survives a
          # failed run); the step still prints no secret values.
          exec > >(tee "${HYPRIAL_E2E_ROOT}/diag/preflight-controlled.txt") 2>&1
          test -n "${HYPRIAL_E2E_LARK_APP_ID}" || { echo "HYPRIAL_E2E_LARK_APP_ID is not injected" >&2; exit 1; }
          test -n "${HYPRIAL_E2E_LARK_APP_SECRET}" || { echo "HYPRIAL_E2E_LARK_APP_SECRET is not injected" >&2; exit 1; }
          test -n "${HYPRIAL_E2E_LARK_CHAT_ID}" || { echo "HYPRIAL_E2E_LARK_CHAT_ID is not injected" >&2; exit 1; }
          if [ "${HYPRIAL_E2E_LARK_APP_ID}" != "cli_aaf9ea19d4b8dbe4" ]; then
            echo "REFUSING: injected App id is not the approved E2E test App (allenwoods-hyprial-e2e)" >&2
            exit 1
          fi
          echo "injected App id matches the approved E2E test App"
          # "The env var was set" and "the credential behind it is usable" are
          # two different things: assert the literal CI claude dir landed in
          # the job env and that its Channel onboarding state exists. Model
          # authentication is DeepSeek-owned and checked separately below.
          if [ "${CLAUDE_CONFIG_DIR}" != "/Users/ci-runner/.claude-ci" ]; then
            echo "REFUSING: CLAUDE_CONFIG_DIR is not the CI-dedicated claude dir: '${CLAUDE_CONFIG_DIR}'" >&2
            exit 1
          fi
          # Refuse, never create: a missing CI root is a provisioning gap to
          # fix by hand, and a wrong one would run CI on real credentials.
          if [ "${CODEX_HOME}" != "/Users/ci-runner/.codex-ci" ]; then
            echo "REFUSING: CODEX_HOME is not the CI-dedicated codex dir: '${CODEX_HOME}'" >&2
            exit 1
          fi
          if [ "${PI_CODING_AGENT_DIR}" != "/Users/ci-runner/.pi-ci/agent" ]; then
            echo "REFUSING: PI_CODING_AGENT_DIR is not the CI-dedicated pi dir: '${PI_CODING_AGENT_DIR}'" >&2
            exit 1
          fi
          test -d "${CODEX_HOME}" || { echo "REFUSING: CI codex dir is missing: ${CODEX_HOME}" >&2; exit 1; }
          test -f "${PI_CODING_AGENT_DIR}/auth.json" || { echo "REFUSING: CI pi auth.json is missing under ${PI_CODING_AGENT_DIR}" >&2; exit 1; }
          uv run --locked --python 3.12 python - <<'PY'
          import json
          import os
          import sys

          config_dir = os.environ["CLAUDE_CONFIG_DIR"]
          try:
              with open(os.path.join(config_dir, ".claude.json"), encoding="utf-8") as handle:
                  onboarding = json.load(handle).get("hasCompletedOnboarding")
          except Exception as error:
              print(f"CI claude onboarding state is unreadable: {error}", file=sys.stderr)
              sys.exit(1)
          if onboarding is not True:
              print(
                  "CI claude login has not completed onboarding; "
                  "run Claude Code once interactively with CLAUDE_CONFIG_DIR pointed at ~/.claude-ci",
                  file=sys.stderr,
              )
              sys.exit(1)
          print("CI claude config dir verified (Channel onboarding complete)")
          PY
          for b in tmux claude codex pi docker; do
            command -v "$b" >/dev/null 2>&1 || { echo "missing prerequisite binary: $b" >&2; exit 1; }
          done
          uv run --locked --python 3.12 python contract/e2e/_deepseek.py
          LARKSUITE_CLI_NO_UPDATE_NOTIFIER=1 LARKSUITE_CLI_NO_SKILLS_NOTIFIER=1 \
            lark-cli auth status --json --verify > /tmp/hyprial-controlled-auth.json || true
          uv run --locked --python 3.12 python - <<'PY'
          import json
          import sys

          try:
              data = json.load(open("/tmp/hyprial-controlled-auth.json"))
          except Exception as error:
              print(f"lark-cli auth status is unparseable: {error}", file=sys.stderr)
              sys.exit(1)
          user = (data.get("identities") or {}).get("user") or {}
          if data.get("verified") is not True:
              print(
                  "lark-cli user identity is not verified "
                  f"(status={user.get('status')!r} tokenStatus={user.get('tokenStatus')!r} "
                  f"refreshExpiresAt={user.get('refreshExpiresAt')!r}); "
                  "re-run lark-cli auth login on the runner host",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(
              "lark-cli user identity verified "
              f"(tokenStatus={user.get('tokenStatus')}, "
              f"refreshExpiresAt={user.get('refreshExpiresAt')})"
          )
          PY
          rm -f /tmp/hyprial-controlled-auth.json
          touch "${HYPRIAL_E2E_ROOT}/preflight.ok"

      # Same periodic assumption check as the isolated gate: scheduled runs only,
      # before any scenario, comparing nothing.
      - name: E2E assumptions still hold
        if: github.event_name == 'schedule'
        run: |
          set -o pipefail
          mkdir -p "${HYPRIAL_E2E_ROOT}/diag"
          uv run --locked --python 3.12 python scripts/ci/check_e2e_impact.py \
            --repo . --validate-only \
            | tee "${HYPRIAL_E2E_ROOT}/diag/e2e-assumptions.json"

      - name: E2E-004 Feishu user/adapter roundtrip
        if: always()
        env:
          HYPRIAL_BIN: ${{ github.workspace }}/.venv/bin/hyprial
          # CI-load headroom for `hyprial init`'s readiness wait (product
          # default 15 s). A hung daemon still fails, at 45 s.
          HYPRIAL_INIT_READY_TIMEOUT: "45"
        run: |
          start=$(date +%s)
          code=0
          if [ ! -f "${HYPRIAL_E2E_ROOT}/preflight.ok" ]; then
            echo "E2E-004 NOT-RUN: preflight refused (see Preflight step)"
            code=3
          else
            # #131④: full output tee'd to diag/ (survives a failed run);
            # PIPESTATUS, never the pipeline rc (tee swallows failures).
            # #143: set +e BEFORE the pipeline — with the runner's
            # bash -eo pipefail, a failing scenario lets errexit kill the
            # shell before PIPESTATUS is read; the .code/row writes below
            # never ran and the verdict misreported "ran and failed" as
            # "MISSING RECORD" (runs #496/#499/#505).
            set +e
            uv run --locked --python 3.12 python contract/e2e/with-machine-lock.py E2E-004 \
              uv run --locked --python 3.12 python contract/e2e/run-feishu-roundtrip.py 2>&1 \
              | tee "${HYPRIAL_E2E_ROOT}/diag/E2E-004.log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ]; then code=$rc; fi
          fi
          mkdir -p "${HYPRIAL_E2E_ROOT}/results"
          echo "$code" > "${HYPRIAL_E2E_ROOT}/results/E2E-004.code"
          row="$(printf '%s\tE2E-004\t%s\t%ss' "$(($(cat "/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv" 2>/dev/null | wc -l) + 1))" "$code" "$(( $(date +%s) - start ))")"
          printf '%s\n' "$row" >> "/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv" || true
          printf '%s\n' "$row" >> "${HYPRIAL_E2E_ROOT}/diag/steps.tsv"
          exit "$code"

      - name: E2E-006 resident providers
        if: always()
        env:
          HYPRIAL_BIN: ${{ github.workspace }}/.venv/bin/hyprial
          # CI-load headroom for `hyprial init`'s readiness wait (product
          # default 15 s). A hung daemon still fails, at 45 s.
          HYPRIAL_INIT_READY_TIMEOUT: "45"
          HYPRIAL_RESIDENT_SKILL: ${{ github.workspace }}/contract/e2e/fixtures/resident-skill
        run: |
          start=$(date +%s)
          code=0
          if [ ! -f "${HYPRIAL_E2E_ROOT}/preflight.ok" ]; then
            echo "E2E-006 NOT-RUN: preflight refused (see Preflight step)"
            code=3
          else
            # #131④: full output tee'd to diag/ (survives a failed run);
            # PIPESTATUS, never the pipeline rc (tee swallows failures).
            # #143: set +e BEFORE the pipeline — with the runner's
            # bash -eo pipefail, a failing scenario lets errexit kill the
            # shell before PIPESTATUS is read; the .code/row writes below
            # never ran and the verdict misreported "ran and failed" as
            # "MISSING RECORD" (runs #496/#499/#505).
            set +e
            uv run --locked --python 3.12 python contract/e2e/with-machine-lock.py E2E-006 \
              uv run --locked --python 3.12 python contract/e2e/run-resident-providers.py 2>&1 \
              | tee "${HYPRIAL_E2E_ROOT}/diag/E2E-006.log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ]; then code=$rc; fi
          fi
          mkdir -p "${HYPRIAL_E2E_ROOT}/results"
          echo "$code" > "${HYPRIAL_E2E_ROOT}/results/E2E-006.code"
          row="$(printf '%s\tE2E-006\t%s\t%ss' "$(($(cat "/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv" 2>/dev/null | wc -l) + 1))" "$code" "$(( $(date +%s) - start ))")"
          printf '%s\n' "$row" >> "/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv" || true
          printf '%s\n' "$row" >> "${HYPRIAL_E2E_ROOT}/diag/steps.tsv"
          exit "$code"

      - name: E2E-008 Claude Code TUI worker (layer-2 smoke, gating)
        if: always()
        env:
          HYPRIAL_BIN: ${{ github.workspace }}/.venv/bin/hyprial
          # CI-load headroom for `hyprial init`'s readiness wait (product
          # default 15 s). A hung daemon still fails, at 45 s.
          HYPRIAL_INIT_READY_TIMEOUT: "45"
        run: |
          start=$(date +%s)
          code=0
          if [ ! -f "${HYPRIAL_E2E_ROOT}/preflight.ok" ]; then
            echo "E2E-008 NOT-RUN: preflight refused (see Preflight step)"
            code=3
          else
            # #131④: full output tee'd to diag/ (survives a failed run);
            # PIPESTATUS, never the pipeline rc (tee swallows failures).
            # #143: set +e BEFORE the pipeline — with the runner's
            # bash -eo pipefail, a failing scenario lets errexit kill the
            # shell before PIPESTATUS is read; the .code/row writes below
            # never ran and the verdict misreported "ran and failed" as
            # "MISSING RECORD" (runs #496/#499/#505).
            set +e
            uv run --locked --python 3.12 python contract/e2e/with-machine-lock.py E2E-008 \
              uv run --locked --python 3.12 python contract/e2e/run-cc-tui-worker.py --attended --smoke 2>&1 \
              | tee "${HYPRIAL_E2E_ROOT}/diag/E2E-008.log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ]; then code=$rc; fi
          fi
          mkdir -p "${HYPRIAL_E2E_ROOT}/results"
          echo "$code" > "${HYPRIAL_E2E_ROOT}/results/E2E-008.code"
          row="$(printf '%s\tE2E-008\t%s\t%ss' "$(($(cat "/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv" 2>/dev/null | wc -l) + 1))" "$code" "$(( $(date +%s) - start ))")"
          printf '%s\n' "$row" >> "/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv" || true
          printf '%s\n' "$row" >> "${HYPRIAL_E2E_ROOT}/diag/steps.tsv"
          exit "$code"

      - name: E2E-012 Codex app-server worker
        if: always()
        env:
          HYPRIAL_BIN: ${{ github.workspace }}/.venv/bin/hyprial
          # CI-load headroom for `hyprial init`'s readiness wait (product
          # default 15 s). A hung daemon still fails, at 45 s.
          HYPRIAL_INIT_READY_TIMEOUT: "45"
        run: |
          start=$(date +%s)
          code=0
          if [ ! -f "${HYPRIAL_E2E_ROOT}/preflight.ok" ]; then
            echo "E2E-012 NOT-RUN: preflight refused (see Preflight step)"
            code=3
          else
            # #131④: full output tee'd to diag/ (survives a failed run);
            # PIPESTATUS, never the pipeline rc (tee swallows failures).
            # #143: set +e BEFORE the pipeline — with the runner's
            # bash -eo pipefail, a failing scenario lets errexit kill the
            # shell before PIPESTATUS is read; the .code/row writes below
            # never ran and the verdict misreported "ran and failed" as
            # "MISSING RECORD" (runs #496/#499/#505).
            set +e
            uv run --locked --python 3.12 python contract/e2e/with-machine-lock.py E2E-012 \
              uv run --locked --python 3.12 python contract/e2e/run-codex-worker.py 2>&1 \
              | tee "${HYPRIAL_E2E_ROOT}/diag/E2E-012.log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ]; then code=$rc; fi
          fi
          mkdir -p "${HYPRIAL_E2E_ROOT}/results"
          echo "$code" > "${HYPRIAL_E2E_ROOT}/results/E2E-012.code"
          row="$(printf '%s\tE2E-012\t%s\t%ss' "$(($(cat "/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv" 2>/dev/null | wc -l) + 1))" "$code" "$(( $(date +%s) - start ))")"
          printf '%s\n' "$row" >> "/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv" || true
          printf '%s\n' "$row" >> "${HYPRIAL_E2E_ROOT}/diag/steps.tsv"
          exit "$code"

      - name: E2E-013 all-harness lifecycle
        if: always()
        env:
          HYPRIAL_BIN: ${{ github.workspace }}/.venv/bin/hyprial
          # CI-load headroom for `hyprial init`'s readiness wait (product
          # default 15 s). A hung daemon still fails, at 45 s.
          HYPRIAL_INIT_READY_TIMEOUT: "45"
        run: |
          start=$(date +%s)
          code=0
          if [ ! -f "${HYPRIAL_E2E_ROOT}/preflight.ok" ]; then
            echo "E2E-013 NOT-RUN: preflight refused (see Preflight step)"
            code=3
          else
            # #131④: full output tee'd to diag/ (survives a failed run);
            # PIPESTATUS, never the pipeline rc (tee swallows failures).
            # #143: set +e BEFORE the pipeline — with the runner's
            # bash -eo pipefail, a failing scenario lets errexit kill the
            # shell before PIPESTATUS is read; the .code/row writes below
            # never ran and the verdict misreported "ran and failed" as
            # "MISSING RECORD" (runs #496/#499/#505).
            set +e
            uv run --locked --python 3.12 python contract/e2e/with-machine-lock.py E2E-013 \
              uv run --locked --python 3.12 python contract/e2e/run-all-harness-lifecycle.py 2>&1 \
              | tee "${HYPRIAL_E2E_ROOT}/diag/E2E-013.log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ]; then code=$rc; fi
          fi
          mkdir -p "${HYPRIAL_E2E_ROOT}/results"
          echo "$code" > "${HYPRIAL_E2E_ROOT}/results/E2E-013.code"
          row="$(printf '%s\tE2E-013\t%s\t%ss' "$(($(cat "/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv" 2>/dev/null | wc -l) + 1))" "$code" "$(( $(date +%s) - start ))")"
          printf '%s\n' "$row" >> "/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv" || true
          printf '%s\n' "$row" >> "${HYPRIAL_E2E_ROOT}/diag/steps.tsv"
          exit "$code"

      - name: E2E-025 tailcat org invite join over real sidecars
        if: always()
        env:
          HYPRIAL_BIN: ${{ github.workspace }}/.venv/bin/hyprial
          HYPRIAL_INIT_READY_TIMEOUT: "45"
          # hyprial-tailcat's go.mod requires Go 1.27.1 (pin added by #1108).
          GO_VERSION: "1.27.1"
        run: |
          start=$(date +%s)
          code=0
          if [ ! -f "${HYPRIAL_E2E_ROOT}/preflight.ok" ]; then
            echo "E2E-025 NOT-RUN: preflight refused (see Preflight step)"
            code=3
          else
            set +e
            # Real sidecar + local labrelay DERP, built from this checkout;
            # the scenario never touches Tailscale's production relays.
            source scripts/ci/ci-ensure-go.sh \
              && bin="${HYPRIAL_E2E_ROOT}/tailcat-bin" && mkdir -p "$bin" \
              && (cd sidecar/hyprial-tailcat \
                  && CGO_ENABLED=0 go build -trimpath -o "$bin/hyprial-tailcat" ./cmd/hyprial-tailcat \
                  && CGO_ENABLED=0 go build -trimpath -o "$bin/hyprial-tailcat-labrelay" ./cmd/hyprial-tailcat-labrelay) \
              && HYPRIAL_TAILCAT_BINARY="$bin/hyprial-tailcat" \
                 HYPRIAL_TAILCAT_LABRELAY="$bin/hyprial-tailcat-labrelay" \
                 uv run --locked --python 3.12 python contract/e2e/with-machine-lock.py E2E-025 \
                 uv run --locked --python 3.12 python contract/e2e/run-tailcat-org-invite-join.py 2>&1 \
              | tee "${HYPRIAL_E2E_ROOT}/diag/E2E-025.log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ]; then code=$rc; fi
          fi
          mkdir -p "${HYPRIAL_E2E_ROOT}/results"
          echo "$code" > "${HYPRIAL_E2E_ROOT}/results/E2E-025.code"
          row="$(printf '%s\tE2E-025\t%s\t%ss' "$(($(cat "/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv" 2>/dev/null | wc -l) + 1))" "$code" "$(( $(date +%s) - start ))")"
          printf '%s\n' "$row" >> "/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv" || true
          printf '%s\n' "$row" >> "${HYPRIAL_E2E_ROOT}/diag/steps.tsv"
          exit "$code"

      - name: Gate verdict (FAIL and BLOCKED/NOT-RUN are never green)
        if: always()
        run: |
          start=$(date +%s)
          set +e
          uv run --locked --python 3.12 python contract/e2e/gate-verdict.py "${HYPRIAL_E2E_ROOT}/results" 2>&1 \
            | tee "${HYPRIAL_E2E_ROOT}/diag/gate-verdict.log"
          rc=${PIPESTATUS[0]}
          set -e
          row="$(printf '%s\tgate-verdict\t%s\t%ss' "$(($(cat "/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv" 2>/dev/null | wc -l) + 1))" "$rc" "$(( $(date +%s) - start ))")"
          printf '%s\n' "$row" >> "/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv" || true
          printf '%s\n' "$row" >> "${HYPRIAL_E2E_ROOT}/diag/steps.tsv"
          exit "$rc"

      - name: Clean isolated runtime
        # success()-only by contract (task #131): on a FAILED run the
        # run-scoped root IS the artifact store (scenario runners preserve
        # failure state under ${HYPRIAL_E2E_ROOT}/artifacts and the results/
        # codes live there too), so deleting it on the failure path erases
        # the evidence a red run exists to provide.  Failed roots are left
        # on disk and reclaimed by the host-level age sweep (#69), including the diag/ step diagnostics (#131④).
        if: success()
        run: |
          start=$(date +%s)
          if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then mkdir -p "${HYPRIAL_E2E_ROOT}/diag" 2>/dev/null || true; fi
          trap 'rc=$?; trace="/tmp/hyprial-e2e-trace-${GITHUB_RUN_ID}.tsv"; row="$(printf "%s\tcleanup\t%s\t%ss" "$(($(cat "$trace" 2>/dev/null | wc -l) + 1))" "$rc" "$(( $(date +%s) - start ))")"; printf "%s\n" "$row" >> "$trace" 2>/dev/null || true; if [ -n "${HYPRIAL_E2E_ROOT:-}" ]; then printf "%s\n" "$row" >> "${HYPRIAL_E2E_ROOT}/diag/steps.tsv" 2>/dev/null || true; fi; exit "$rc"' EXIT
          case "${HYPRIAL_E2E_ROOT}" in
            /tmp/hyprial-e2e-controlled-*) rm -rf -- "${HYPRIAL_E2E_ROOT}" ;;
            *) echo "refusing unsafe cleanup path: ${HYPRIAL_E2E_ROOT}" >&2; exit 1 ;;
          esac

      # Nightly promotion chain, writer half (contract, do not weaken):
      # this step is the ONLY writer of gate-e2e-controlled.json, it runs
      # only when the whole scheduled job is green (Gate verdict included),
      # and it never moves any tag itself.  release-nightly-promote.yml promotes ONLY
      # when gate-e2e.json and gate-e2e-controlled.json name the SAME sha,
      # both fresh from the same night — one green gate never promotes.
      - name: Record gate-green marker (scheduled runs only)
        if: success() && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MARKER="gate-e2e-controlled.json"
          work="$(mktemp -d)"
          cd "${work}"
          git init -q .
          # Host-side origin: see the checkout step above for why this is NOT
          # ${GITHUB_SERVER_URL}. Token rides in the step environment as a
          # URL-scoped extraHeader (this step ls-remote/fetch/pushes in a
          # retry loop), never in the remote URL.
          git remote add origin "http://git.internal.hyprial.com:3000/${GITHUB_REPOSITORY}.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.http://git.internal.hyprial.com:3000/.extraHeader"
          export GIT_CONFIG_VALUE_0="Authorization: token ${GITHUB_TOKEN}"
          git config user.name "hyprial-ci"
          git config user.email "ci@hyprial.invalid"
          if git ls-remote --exit-code origin refs/heads/ci/gate-status >/dev/null 2>&1; then
            git fetch --depth=1 origin ci/gate-status
            git checkout -q -B ci/gate-status FETCH_HEAD
          else
            git checkout -q --orphan ci/gate-status
          fi
          cat > "${MARKER}" <<EOF
          {"sha":"${GITHUB_SHA}","runId":"${GITHUB_RUN_ID}","workflow":"${GITHUB_WORKFLOW}","concludedAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","epoch":$(date -u +%s)}
          EOF
          git add "${MARKER}"
          git commit -q -m "ci(gate-status): ${GITHUB_WORKFLOW} green at ${GITHUB_SHA}"
          # The two gate workflows write disjoint files on one branch; a push
          # race is a non-fast-forward, cured by rebase (never force).
          for attempt in 1 2 3 4 5; do
            if git push -q origin ci/gate-status; then
              exit 0
            fi
            git fetch -q origin ci/gate-status
            git rebase -q "$(git rev-parse FETCH_HEAD)" || exit 1
          done
          echo "ci/gate-status push lost the race 5 times" >&2
          exit 1

      - name: Record end CI conditions
        if: always()
        run: bash scripts/ci/ci-conditions.sh end

      - name: Upload CI conditions artifact
        id: ci_conditions_artifact
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v3
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          http_proxy: ""
          https_proxy: ""
        with:
          name: ci-conditions-${{ github.job }}
          path: ${{ runner.temp }}/ci-conditions-${{ github.job }}.txt
          if-no-files-found: error

      - name: Report CI conditions artifact upload failure
        if: always() && steps.ci_conditions_artifact.outcome == 'failure'
        run: bash scripts/ci/ci-conditions.sh artifact
