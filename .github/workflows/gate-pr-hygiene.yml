# gate-pr-hygiene —— PR 卫生门（2026-11-06 从 tests.yml 拆出，job 名与内容不变）。
# 合并树上的结构门、registry 并集、Submitted-by 身份行等，只在 pull_request 上跑。
# 拆出前它挂在 tests.yml 的 `unit` 的 needs 上，靠 `tests / unit*` 阻塞合并；
# 拆出后它自己的 context `gate-pr-hygiene / pr-hygiene*` 必须是 required check。

name: gate-pr-hygiene
on:
  pull_request:
    # `edited`: pr-hygiene reads `github.event.pull_request.body` as it was when
    # the event fired, so adding the `Submitted-by` line must re-run this gate.
    types: [opened, synchronize, reopened, edited]
    branches: [dev, main, "intg/**", "release/**", "refactor/reconstruct-modules"]

concurrency:
  group: gate-pr-hygiene-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-hygiene:
    # Merge-blocking PR hygiene. Three rules, one red step each:
    #   (1) merge-tree: the structural gates and the fast CI-policy tests run
    #       on the MATERIALISED merge tree, because PR CI checks out the PR
    #       head (`ci-plan.mjs` asserts rev-parse HEAD == pr.head.sha), so the
    #       merge composition is otherwise unobserved. A conflict is a red.
    #   (2) registry-union: a configured registry must not lose an entry in
    #       the merge (merged ⊇ base ∪ head); see scripts/ci/registry-union.json.
    #   (3) submitted-by: the body's first line carries the agent identity.
    #
    # BLOCKING MECHANISM (2026-11-06): this job is its own workflow, so it
    # blocks a merge only because `gate-pr-hygiene / pr-hygiene*` is a required
    # status check on dev and main. Until 2026-11-06 it lived in tests.yml as a
    # `needs:` of `unit` and blocked through `tests / unit*` instead.
    if: github.event_name == 'pull_request'
    # release/** 的 PR 走专用池（Allen 2026-10-30: 发版不与其他任务混）；
    # 其它分支走 ci-light（Allen 2026-11-03: skill-impact 类检查不占用主 CI
    # runner）。ci-light 是 HQ 主机上的 host 模式 runner，下方两个步骤
    # 负责把 job 环境适配到宿主机；release-ci 保持容器默认不变。
    runs-on: ${{ startsWith(github.base_ref, 'release/') && 'release-ci' || 'ci-light' }}
    # uv/CPython 3.12 acquisition up to 6 min, the full-history checkout, then
    # the merge-tree structural gates and the Node CI-policy tests.
    timeout-minutes: 20
    env:
      HTTPS_PROXY: http://host.docker.internal:7896
      HTTP_PROXY: http://host.docker.internal:7896
      NO_PROXY: localhost,127.0.0.1,::1,tailscale,forgejo-tailscale,.ts.net,.internal.hyprial.com,code.hyprial.com
      UV_HTTP_TIMEOUT: "60"
      UV_HTTP_RETRIES: "10"
    steps:
      - name: Check out the head commit with base history
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          # ci-light is a host-mode runner on the HQ host (Forgejo moved to
          # another host, 2026-10-29): the container-only names in the
          # defaults above do not resolve on a host -- measured 2026-11-03,
          # getaddrinfo fails for `tailscale` and for `host.docker.internal`,
          # and DIRECT egress to pypi.org times out on this host (the #2219
          # dead-v6 path lives here too). MagicDNS `forgejo` reaches the
          # instance and 127.0.0.1:7896 reaches the same mihomo proxy the
          # containers use. Pools that resolve the default (release-ci) keep
          # it: no write below happens and this prologue is a no-op there.
          # It lives inside this first step because the checkout below needs
          # the rewritten origin, and the ci-conditions reader must stay the
          # job's first step shape (carries_reader contract).
          # 2026-11-05 review blocker on the first ci-light cut: $GITHUB_ENV
          # only affects LATER steps, so a bare `>> "$GITHUB_ENV"` left the
          # remote add and the fetch in THIS step on the container-only names
          # (and on the unresolvable host.docker.internal proxy). env_sync
          # exports in-step AND persists for later steps through one path, so
          # the two scopes cannot drift apart again.
          server_host="$(printf '%s' "${DEFAULT_SERVER_URL%/}" | sed -E 's#^[a-zA-Z]+://##; s#[/:?].*$##')"
          if python3 -c 'import socket,sys; socket.getaddrinfo(sys.argv[1],None)' "${server_host}" 2>/dev/null; then
            echo "host adapter: ${server_host} resolves here; keeping runner defaults"
          else
            env_sync() {
              printf '%s\n' "$1" >>"${GITHUB_ENV}"
              export "${1?}"
            }
            env_sync "GITHUB_SERVER_URL=http://forgejo:3000"
            env_sync "HTTPS_PROXY=http://127.0.0.1:7896"
            env_sync "HTTP_PROXY=http://127.0.0.1:7896"
            env_sync "https_proxy=http://127.0.0.1:7896"
            env_sync "http_proxy=http://127.0.0.1:7896"
            env_sync "NO_PROXY=localhost,127.0.0.1,::1,forgejo,forgejo-tailscale,tailscale,.ts.net,.internal.hyprial.com,code.hyprial.com"
            env_sync "no_proxy=localhost,127.0.0.1,::1,forgejo,forgejo-tailscale,tailscale,.ts.net,.internal.hyprial.com,code.hyprial.com"
            env_sync "FORGEJO_SERVER_URL=http://forgejo:3000"
            echo "host adapter: ${server_host} unresolvable; origin and proxy rewritten for the host"
          fi
          ASKPASS="${RUNNER_TEMP}/hyprial-git-askpass-${GITHUB_RUN_ID}"
          cat >"${ASKPASS}" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "${GITHUB_TOKEN}" ;;
          esac
          SH
          chmod 700 "${ASKPASS}"
          # The askpass lives for THIS STEP ONLY and is deleted below. The
          # pr-hygiene rules authenticate their own fetch per command (see
          # PR_HYGIENE_GIT_TOKEN below), because a credential must never
          # outlive the step that needs it: this job runs the PR's own code.
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}.git"
          # FULL (non-shallow) history for the head AND the base branch: neither
          # `merge-base --is-ancestor` nor `git merge` can answer from a
          # --depth=1 checkout. HEAD is pr.head.sha, the same commit the rest of
          # CI checks out (`ci-plan.mjs` asserts that equality).
          # Retry the fetch (release/v0.5.5.4 0ec4a7233): this step cannot be made
          # optional (the merge composition needs real git objects), so a bounded retry is the
          # only safe mitigation for a network blip.  Measured 2026-10-29: 0 checkout
          # failures in 60 pr-hygiene failures => <=4.9% of failures (<=2.6% of PRs).
          fetch_ok=0
          for attempt in 1 2 3; do
            if GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0 \
                git fetch --no-tags origin "${HEAD_SHA}" \
                  "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"; then
              fetch_ok=1; break
            fi
            echo "checkout: fetch attempt ${attempt}/3 failed (network?), retrying in $((attempt * 5))s" >&2
            sleep $((attempt * 5))
          done
          rm -f "${ASKPASS}"
          [ "${fetch_ok}" = "1" ] || { echo "checkout: git fetch failed after 3 attempts" >&2; exit 1; }
          git checkout --detach "${HEAD_SHA}"
          bash scripts/ci/ci-conditions.sh start

      - name: Expose host toolchain on PATH
        run: |
          set -euo pipefail
          # The merge-composition gate runs `node --test` and `uv` from PATH.
          # Host runners get launchd's minimal PATH
          # (/usr/bin:/bin:/usr/sbin:/sbin), which lacks Homebrew; container
          # pools ship their own tools and are unaffected (the directories
          # below do not exist there).
          for tool_dir in /opt/homebrew/bin /usr/local/bin; do
            if [ -d "${tool_dir}" ]; then
              printf '%s\n' "${tool_dir}" >> "${GITHUB_PATH}"
              echo "host PATH: +${tool_dir}"
            fi
          done

      - name: Take the merge-blocking hygiene gate from the base ref
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || '' }}
        run: |
          source scripts/ci/ci-step.sh pr-hygiene
          # The gate must not be supplied by the pull request it judges
          # (kanban 1d076332, from the #1400 findings): running the checked-out
          # copy meant a candidate could weaken its own gate, and every fix to
          # the gate had to land on the base branch before it could fail
          # anything. The base-ref copy is written over the same relative path,
          # so the script's own ROOT resolution still points at the repository
          # root, and the four rules below then run base-ref code against the
          # checked-out head tree.
          ref="origin/${BASE_REF}"
          gate="scripts/ci/check_pr_hygiene.py"
          git show "${ref}:${gate}" >"${gate}"
          printf 'pr-hygiene gate source: %s:%s @ %s\n' \
            "${ref}" "${gate}" "$(git rev-parse "${ref}:${gate}")"

      - name: Point the uv cache at the shared CI cache
        # #2219 restored the proxy and UV_HTTP_TIMEOUT for the merge-tree gate,
        # but every job still started with a cold uv cache: pytest and its
        # dependencies were downloaded over the proxy on every PR, which put a
        # third-party download on the critical path of a required check.
        # UV_CACHE_DIR is set through GITHUB_ENV rather than `env:` because its
        # value depends on CI_CACHE_ROOT, which only exists on the DinD runners
        # (it is absent locally and in release-ci); a literal `env:` entry would
        # then point uv at a non-existent path.
        # scripts/git_environment.py keeps UV_CACHE_DIR in its allowlist, so the
        # merge-tree gate's stripped child environment keeps this setting.
        run: |
          set -euo pipefail
          root="${CI_CACHE_ROOT:-}"
          if [ -n "$root" ] && [ -d "$root" ] && [ -w "$root" ]; then
            cache="${root}/uv"
            mkdir -p "$cache"
            printf 'UV_CACHE_DIR=%s\n' "$cache" >>"$GITHUB_ENV"
            echo "uv-cache: shared (${cache})"
          else
            echo "uv-cache: per-job (CI_CACHE_ROOT='${root}' absent or not writable)"
          fi

      - name: Ensure uv
        timeout-minutes: 6
        run: |
          source scripts/ci/ci-step.sh ensure-uv
          # ci-ensure-uv.sh tries the host uv first (the ci-light host has the pinned
          # one under Homebrew), then the pinned cache, then the installer, and
          # prints the tier it used.
          UV_VERSION=0.11.7 bash scripts/ci/ci-ensure-uv.sh
          bash scripts/ci/ci-ensure-cpython-mirror.sh

      - name: Warm the Python interpreter and the pytest overlay
        timeout-minutes: 8
        run: |
          source scripts/ci/ci-step.sh warm-uv
          source scripts/ci/ci-retry.sh
          ci_retry_uv uv-python uv run --no-project --python 3.12 python -c 'pass'
          ci_retry_uv uv-overlay uv run --no-project --with pytest python -c 'import pytest'

      - name: Remind on new inline comments
        if: env.BASE_REF != ''
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
        run: |
          source scripts/ci/ci-step.sh inline-comments
          uv run --no-project --python 3.12 python scripts/ci/check_inline_comments.py \
            --base "origin/${BASE_REF}" --head "${HEAD_SHA}" --annotations

      - name: Require the Submitted-by identity line
        env:
          PR_BODY: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || '' }}
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
          PR_CREATED_AT: ${{ github.event_name == 'pull_request' && github.event.pull_request.created_at || '' }}
        run: |
          source scripts/ci/ci-step.sh pr-hygiene
          printf '%s' "${PR_BODY:-}" > "${RUNNER_TEMP}/pr-body.txt"
          uv run --no-project --python 3.12 python scripts/ci/check_pr_hygiene.py \
            submitted-by --body-file "${RUNNER_TEMP}/pr-body.txt" \
            --pr-number "${PR_NUMBER:-}" --created-at "${PR_CREATED_AT:-}"

      - name: Gate the merge tree
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || '' }}
          PR_HYGIENE_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source scripts/ci/ci-step.sh pr-hygiene
          uv run --no-project --python 3.12 python scripts/ci/check_pr_hygiene.py \
            merge-tree --base-ref "${BASE_REF}" \
            --worktree "${RUNNER_TEMP}/pr-merge-tree"

      - name: Reject a registry entry dropped by the merge
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || '' }}
          PR_HYGIENE_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source scripts/ci/ci-step.sh pr-hygiene
          uv run --no-project --python 3.12 python scripts/ci/check_pr_hygiene.py \
            registry-union --base-ref "${BASE_REF}" \
            --merged-root "${RUNNER_TEMP}/pr-merge-tree"

      - name: Assert the credential did not outlive its step
        run: |
          set -euo pipefail
          leaked=""
          [ -n "${PR_HYGIENE_GIT_TOKEN:-}" ] && leaked="PR_HYGIENE_GIT_TOKEN"
          [ -n "${GIT_ASKPASS:-}" ] && leaked="${leaked:+$leaked,}GIT_ASKPASS"
          [ -e "${RUNNER_TEMP}/hyprial-git-askpass-${GITHUB_RUN_ID}" ] && leaked="${leaked:+$leaked,}askpass-file"
          printf 'pr-hygiene credential scope: leaked_in_later_step=%s runner_injected_github_token=%s runner_injected_forgejo_token=%s\n' \
            "${leaked:-none}" \
            "$([ -n "${GITHUB_TOKEN:-}" ] && echo yes || echo no)" \
            "$([ -n "${FORGEJO_TOKEN:-}" ] && echo yes || echo no)"
          [ -z "$leaked" ] || { echo "FAIL: a credential outlived its step: $leaked"; exit 1; }

      - name: Detect a landed shell PR (advisory; labels and comments, never closes)
        # OI-2.  The detector evaluates `git cherry` against **the PR's own base.ref**
        # (§6.11) and, when conclusive, emits the label `shell-pr-landed` plus one
        # comment.  It NEVER closes anything: the close action belongs to this PR's
        # line owner (hq is the backstop).
        # 2026-11-07: dry run ended. Both preconditions hold: the label exists, and
        # the reviewed round was clean -- 17 detector verdicts across PRs into dev,
        # main and release/v0.5.5.4 (incl. merge PRs), all `not-landed` /
        # `action=none`, no false positive. check_shell_pr.py reports API errors
        # and always exits 0, so a write failure can never red this required job.
        # Set SHELL_PR_APPLY to "0" to go back to a dry run.
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          SHELL_PR_APPLY: "1"
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
          FORGEJO_REPO: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source scripts/ci/ci-step.sh shell-pr
          apply=""
          [ "${SHELL_PR_APPLY}" = "1" ] && apply="--apply"
          uv run --no-project --python 3.12 python scripts/ci/check_shell_pr.py \
            --base "${BASE_REF:-}" --head "${HEAD_SHA:-}" --pr "${PR_NUMBER:-}" \
            --repo "${FORGEJO_REPO}" ${apply}

      - name: Enforce the actor-rustify CI-I change surface
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || '' }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          source scripts/ci/ci-step.sh ci-i
          for name in BASE_REF HEAD_REF HEAD_SHA; do
            [ -n "${!name:-}" ] || { echo "NOT EVALUABLE: ${name} is empty" >&2; exit 2; }
          done
          audit="scripts/ci/audit_actor_rustify_ci.py"
          trusted="${RUNNER_TEMP}/ci-i-audit-${GITHUB_RUN_ID}/scripts/ci/audit_actor_rustify_ci.py"
          mkdir -p "$(dirname "${trusted}")"
          base_ref="origin/${BASE_REF}"
          git rev-parse --verify --quiet "${base_ref}^{commit}" >/dev/null \
            || { echo "NOT EVALUABLE: ${base_ref} does not resolve" >&2; exit 2; }
          if git cat-file -e "${base_ref}:${audit}" 2>/dev/null; then
            git show "${base_ref}:${audit}" >"${trusted}"
            echo "CI-I audit source: ${base_ref}:${audit} @ $(git rev-parse "${base_ref}:${audit}")"
          else
            cp "${audit}" "${trusted}"
            echo "CI-I audit bootstrap: ${base_ref} has no ${audit}; running the head copy until it lands"
          fi
          uv run --no-project --python 3.12 python "${trusted}" --root "${PWD}" \
            --base-ref "${BASE_REF}" --head "${HEAD_SHA}" --head-ref-name "${HEAD_REF}"

      - name: Record end CI conditions
        if: always()
        run: bash scripts/ci/ci-conditions.sh end

      - name: Upload CI conditions artifact
        id: ci_conditions_artifact
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v3
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          http_proxy: ""
          https_proxy: ""
        with:
          name: ci-conditions-${{ github.job }}
          path: ${{ runner.temp }}/ci-conditions-${{ github.job }}.txt
          if-no-files-found: error

      - name: Report CI conditions artifact upload failure (advisory)
        # release/v0.5.5.4 ddb2c6357 (2026-10-29): this step used to exit non-zero,
        # turning an artifact-service blip into a red policy job -- and, with this
        # job a required status, a merge freeze (44 upload failures in 12h). The
        # policy rules decide the job; a missing artifact must not rewrite that.
        # Visibility stays: an annotation, a summary line and the
        # ARTIFACT_UPLOAD_RETRY marker the infra-side watcher counts.
        if: always() && steps.ci_conditions_artifact.outcome == 'failure'
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "::warning title=artifact upload failed::ci-conditions-${{ github.job }} was not uploaded; the policy verdict stands but this run has no CI conditions artifact"
          echo "ARTIFACT_UPLOAD_RETRY artifact=ci-conditions-${{ github.job }} outcome=failed attempts=1"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Artifact upload failed (advisory)"
              echo "- artifact: ci-conditions-${{ github.job }}"
              echo "- the policy rules still decided this job; treat the missing artifact as lost telemetry"
              echo "- rolling failure counts: infra-side watcher (ci-degraded-watch.sh, exit 50 on streak>=3)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          bash scripts/ci/ci-conditions.sh artifact || true
