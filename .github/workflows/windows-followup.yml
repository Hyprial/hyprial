# Decisions (Windows follow-up verification for KP-134, KP-135, KP-136):
# - Verification only. It measures the pull request on a GitHub-hosted Windows
#   runner and is not part of the merge gate; no branch rule requires it.
# - A hosted runner is Windows Server under an administrator account with no
#   desktop session. A pass here is recorded as "GitHub-hosted Windows runner",
#   never as a Windows 11 real-machine pass. KP-136 depends on real terminal
#   hosts, so its job stays advisory: it prints the handle facts and closes a
#   pipe and a pseudo console on a GUI started the way the wheel smoke script
#   starts it (pre-created isolated directories, --no-open --json --port 0).
# - KP-134 runs on three Node majors because the real-machine symptom (the
#   worker starts, then exits at the random call) may depend on the version.
# - KP-135 runs the exact reproduction on the base commit and on the head. The
#   base leg is expected to fail; it is there so a pass on the head is known to
#   come from the change and not from the runner.
# - GitHub-hosted runners only, read-only token, no secret, no
#   pull_request_target. Actions are pinned to the same commit SHAs as the
#   merge gate (actions/checkout v7.0.1, astral-sh/setup-uv v10.4.0,
#   actions/setup-node v7.1.0, actions/upload-artifact v7.0.2).
# - Limited by path to the files these three problems touch, so it does not run
#   on unrelated pull requests.
name: windows-followup

on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/windows-followup.yml"
      - "scripts/verify/windows_followup_probe.py"
      - "scripts/verify/stdin_stop_windows_probe.py"
      - "scripts/build/build_native_engine.sh"
      - "src/hyprial/gui_build_hook.py"
      - "src/hyprial/shell/impl/packaging/**"
      - "src/hyprial/daemon/impl/harnesses/pi/**"
      - "src/hyprial/kernel/impl/manysys/**"
      - "src/hyprial/identity/impl/agents/home/environment.py"

permissions:
  contents: read

concurrency:
  group: windows-followup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.7"
  PYTHON_VERSION: "3.12"
  RUST_VERSION: "1.93.1"
  PI_PACKAGE: "@earendil-works/pi-coding-agent@0.85.1"
  NO_COLOR: "1"
  PYTHONUTF8: "1"

defaults:
  run:
    shell: pwsh

jobs:
  kp135-native-build:
    name: kp135 native build (${{ matrix.leg }})
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: ${{ matrix.leg == 'base' }}
    strategy:
      fail-fast: false
      matrix:
        leg: [base, head]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.leg == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install $env:RUST_VERSION --profile minimal
      - name: Source install with the native engine (the KP-135 reproduction)
        env:
          HYPRIAL_BUILD_NATIVE: "1"
        run: |
          uv sync --locked --python $env:PYTHON_VERSION --extra test --reinstall-package hyprial 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\sync.log"
          $code = $LASTEXITCODE
          "sync exit code: $code" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if (Select-String -Path "$env:RUNNER_TEMP\sync.log" -Pattern 'WinError 193' -Quiet) {
            "sync output contains WinError 193" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          exit $code
      - name: Import the staged engine
        if: always()
        run: |
          Get-ChildItem src\hyprial\_core -ErrorAction SilentlyContinue | Select-Object Name, Length
          uv run --locked --no-sync python -c "from hyprial._core import actors; print(actors.__file__); print('ENGINE_ABI_VERSION', actors.ENGINE_ABI_VERSION)"

  kp134-pi:
    name: kp134 pi package root and worker environment (node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
      - name: Install the locked environment without the native engine
        run: uv sync --locked --python $env:PYTHON_VERSION --extra test
      - name: Install Pi the way a user does
        run: |
          npm install -g --no-audit --no-fund $env:PI_PACKAGE
          "npm prefix -g: $(npm prefix -g)"
          Get-Command pi -All | Format-List Name, Source, CommandType
      - name: Probe the package root and the worker environment
        if: always()
        run: |
          uv run --locked --no-sync python scripts/verify/windows_followup_probe.py | Tee-Object -FilePath "$env:RUNNER_TEMP\kp134.json"
          $code = $LASTEXITCODE
          '```json' | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content "$env:RUNNER_TEMP\kp134.json" | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $code
      - name: Upload the probe result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kp134-probe-node${{ matrix.node }}
          path: ${{ runner.temp }}/kp134.json
          retention-days: 7
          if-no-files-found: warn

  changed-tests:
    name: changed test directories on Windows (advisory)
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install $env:RUST_VERSION --profile minimal
      - name: Source install with the native engine
        env:
          HYPRIAL_BUILD_NATIVE: "1"
        run: uv sync --locked --python $env:PYTHON_VERSION --extra test --reinstall-package hyprial
      - name: Tests added by this pull request
        if: always()
        run: >
          uv run --locked --no-sync pytest -q -p no:cacheprovider
          --basetemp="$env:RUNNER_TEMP\pytest-new"
          --junitxml="$env:RUNNER_TEMP\pytest-results\new.xml"
          tests/daemon/harnesses/pi/configuration/launch_trust/test_pi_sdk_package_root.py
          tests/kernel/manysys/test_stdin_stop_windows_branches.py
          tests/shell/packaging/native_engine/test_editable_build.py
      - name: Whole directories of the changed files
        if: always()
        env:
          HYPRIAL_CI_PROFILE: "1"
        run: >
          uv run --locked --no-sync pytest -q -p no:cacheprovider
          -n 4 --dist=loadfile --max-worker-restart=0
          --continue-on-collection-errors
          --basetemp="$env:RUNNER_TEMP\pytest-dirs"
          --junitxml="$env:RUNNER_TEMP\pytest-results\dirs.xml"
          tests/daemon/harnesses/pi tests/shell/packaging tests/kernel/manysys
      - name: Upload the JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-pytest
          path: ${{ runner.temp }}/pytest-results/
          retention-days: 7
          if-no-files-found: warn

  kp136-stdin-stop:
    name: kp136 stdin-stop facts (advisory, partial)
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install the locked environment without the native engine
        run: uv sync --locked --python $env:PYTHON_VERSION --extra test
      - name: Handle facts as the runner sees them
        if: always()
        run: uv run --locked --no-sync python scripts/verify/stdin_stop_windows_probe.py facts
      - name: Prepare an isolated home
        if: always()
        run: |
          $root = Join-Path $env:RUNNER_TEMP "g"
          foreach ($name in @("u", "h", "s", "t")) { New-Item -ItemType Directory -Force -Path (Join-Path $root $name) | Out-Null }
          "HOME=$root\u" >> $env:GITHUB_ENV
          "USERPROFILE=$root\u" >> $env:GITHUB_ENV
          "HYPRIAL_HOME=$root\h" >> $env:GITHUB_ENV
          "HARNESS_STATE_DIR=$root\s" >> $env:GITHUB_ENV
          "HYPRIAL_NETWORK_ISOLATED=1" >> $env:GITHUB_ENV
          "HYPRIAL_USAGE_DISABLE=1" >> $env:GITHUB_ENV
          "HYPRIAL_PEER_DISCOVERY=0" >> $env:GITHUB_ENV
          "NO_PROXY=127.0.0.1,localhost,::1" >> $env:GITHUB_ENV
      - name: Close a pipe on a running gui --stdin-stop
        if: always()
        run: >
          uv run --locked --no-sync python scripts/verify/stdin_stop_windows_probe.py
          run --via pipe --after 30 --timeout 120 --
          "$env:GITHUB_WORKSPACE\.venv\Scripts\hyprial.exe" gui --no-open --json --port 0 --stdin-stop
      - name: Close a pseudo console on a running gui --stdin-stop
        if: always()
        run: >
          uv run --locked --no-sync python scripts/verify/stdin_stop_windows_probe.py
          run --via conpty --after 30 --timeout 120 --
          "$env:GITHUB_WORKSPACE\.venv\Scripts\hyprial.exe" gui --no-open --json --port 0 --stdin-stop
