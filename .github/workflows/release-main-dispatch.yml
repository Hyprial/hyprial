# Dev-first migration, 2026-11-08: main push no longer publishes a release.
# Retain this diagnostic entrypoint for old operator links and runner inventory.
# Release preparation uses release-tag with an explicit reviewed dev-history SHA.
name: release-main-dispatch
on:
  workflow_dispatch:

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HTTPS_PROXY: http://host.docker.internal:7896
      HTTP_PROXY: http://host.docker.internal:7896
      NO_PROXY: localhost,127.0.0.1,::1,tailscale,.ts.net,.internal.hyprial.com,code.hyprial.com
    steps:
      - name: Check out diagnostic SHA and record start conditions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" | grep -Eq '^[0-9a-f]{40}$'
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL%/}/.extraHeader"
          export GIT_CONFIG_VALUE_0="Authorization: token ${GITHUB_TOKEN}"
          export GIT_TERMINAL_PROMPT=0
          server_host="${GITHUB_SERVER_URL#http*://}"; server_host="${server_host%%[:/]*}"
          export NO_PROXY="${NO_PROXY},${server_host}"
          git init .
          git remote add origin "${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          bash scripts/ci/ci-conditions.sh start

      - name: Report the retired main release listener
        id: dispatch
        run: |
          set -euo pipefail
          printf '%s\n' 'main-release is retired: use release-tag with an explicitly reviewed dev-history SHA.'
          printf '%s\n' 'No release tag, track, workflow dispatch or publication was changed.'

      - name: Record end CI conditions
        if: always()
        run: bash scripts/ci/ci-conditions.sh end

      - name: Upload CI conditions artifact
        id: ci_conditions_artifact
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v3
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          http_proxy: ""
          https_proxy: ""
        with:
          name: ci-conditions-${{ github.job }}
          path: ${{ runner.temp }}/ci-conditions-${{ github.job }}.txt
          if-no-files-found: error

      - name: Report CI conditions artifact upload failure
        if: always() && steps.ci_conditions_artifact.outcome == 'failure'
        run: bash scripts/ci/ci-conditions.sh artifact
