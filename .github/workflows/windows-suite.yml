# Decisions (2026-11-26):
# - actions/checkout v7.0.1 pinned to 3d3c42e5aac5ba805825da76410c181273ba90b1 (verified 2026-11-26).
# - astral-sh/setup-uv v10.4.0 pinned to 1db35dd8eee11c5894872e0b383ae6c406cf738d (verified 2026-11-26).
# - actions/upload-artifact v7.0.2 pinned to cf430e030ddbb5b0abf93d22962f4752f3646cd9 (verified 2026-11-26).
# - actions/download-artifact v8.0.2 pinned to 9000827ccba6bdab643e8b6fd33ac0654aef8333 (verified 2026-11-26).
# - Tier 2 (full suite) runs on nightly schedule and fixed-choice workflow_dispatch only;
#   all dispatch inputs enter scripts through step env variables, never interpolated in run:.
# - build-native compiles the editable Rust module once and uploads actors*.pyd and
#   actors.stamp.json (plus tailcat.exe when present) so test shards reuse the staged
#   native bundle without recompiling Rust.
# - Concurrency serializes full-suite runs in one group while isolating dispatch selections
#   per ref, with cancel-in-progress: false so in-flight evidence runs finish intact.
# - Every path under runner.temp is named suite-* and is written and read by the same
#   directory: build-native stages the bundle it uploads, each test leg downloads plan and
#   native inputs into suite-in/, and writes results and ledger to the two directories it
#   uploads.  Result artifacts contain only suite-results/ and suite-ledger/.
# - windows-suite-summary downloads all available artifacts and validates every required
#   leg named in plan-manifest.json so a missing or aborted leg fails closed.
name: windows-suite

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      selection:
        description: "Test suite selection to run"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - tier1-next
          - arm-next
          - targets
      acl_probe:
        description: "Enable directory creation ACL audit probe"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.selection == 'full') && 'windows-suite-full' || format('windows-suite-{0}-{1}', inputs.selection, github.ref) }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.7"
  PYTHON_VERSION: "3.12"
  RUST_VERSION: "1.93.1"
  NO_COLOR: "1"
  PYTHONUTF8: "1"

defaults:
  run:
    shell: pwsh

jobs:
  plan-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: ${{ env.UV_VERSION }}
      - name: Plan test suite shards
        env:
          WINDOWS_SUITE_SELECTION: ${{ inputs.selection || 'full' }}
        run: |
          uv run --no-project --python "$PYTHON_VERSION" python scripts/ci/windows/shard_files.py --plan --shards 4 --wave-size 120 --out "${{ runner.temp }}/suite-plan/plan-manifest.json"
          code=$?
          exit $code
      - name: Upload suite plan
        id: upload-suite-plan
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-suite-plan
          path: ${{ runner.temp }}/suite-plan/
          if-no-files-found: error
      - name: Record suite plan upload outcome
        if: always()
        run: |
          echo "windows-suite-plan upload: ${{ steps.upload-suite-plan.outcome }}" >> "$GITHUB_STEP_SUMMARY"

  build-native:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          $code = $LASTEXITCODE
          exit $code
      - name: Build the editable native module
        timeout-minutes: 20
        env:
          HYPRIAL_BUILD_NATIVE: "1"
        run: |
          uv sync --locked --python $env:PYTHON_VERSION --extra test
          $code = $LASTEXITCODE
          exit $code
      - name: Stage editable native bundle
        run: |
          $out = "$env:RUNNER_TEMP\suite-native-bundle"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $modules = Get-ChildItem -Path "src\hyprial\_core" -Filter "actors*.pyd" -ErrorAction Stop
          if (-not $modules) { throw "missing actors*.pyd in src\hyprial\_core" }
          Copy-Item -Path $modules.FullName -Destination $out -Force
          Copy-Item -Path "src\hyprial\_core\actors.stamp.json" -Destination $out -Force -ErrorAction Stop
          if (Test-Path "src\hyprial\_core\tailcat.exe") {
            Copy-Item -Path "src\hyprial\_core\tailcat.exe" -Destination $out -Force
          }
      - name: Upload editable native bundle
        id: upload-editable-native
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-editable-native
          path: ${{ runner.temp }}/suite-native-bundle/
          if-no-files-found: error
      - name: Record editable native upload outcome
        if: always()
        run: '"windows-editable-native upload: ${{ steps.upload-editable-native.outcome }}" | Add-Content $env:GITHUB_STEP_SUMMARY'

  tier2-pytest:
    runs-on: windows-latest
    needs: [plan-suite, build-native]
    if: github.event_name == 'schedule' || inputs.selection == 'full'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-suite-plan
          path: ${{ runner.temp }}/suite-in/plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-editable-native
          path: ${{ runner.temp }}/suite-in/native
      - name: Restore editable native bundle
        run: |
          New-Item -ItemType Directory -Force -Path "src\hyprial\_core" | Out-Null
          Copy-Item -Path "$env:RUNNER_TEMP\suite-in\native\*" -Destination "src\hyprial\_core" -Force
      - name: Install the editable test environment
        timeout-minutes: 20
        run: |
          uv sync --locked --python $env:PYTHON_VERSION --extra test
          $code = $LASTEXITCODE
          exit $code
      - name: Run tier 2 shard waves
        timeout-minutes: 150
        env:
          WINDOWS_SUITE_SHARD: ${{ matrix.shard }}
          WINDOWS_SUITE_ACL_PROBE: ${{ inputs.acl_probe || false }}
        run: |
          .venv\Scripts\python.exe scripts/ci/windows/run_waves.py --tier 2 --plan-manifest "$env:RUNNER_TEMP\suite-in\plan\plan-manifest.json" --shard $env:WINDOWS_SUITE_SHARD --workers 4 --watchdog-seconds 600 --idle-seconds 900 --wave-minutes 40 --deadline-minutes 140 --step-minutes 150 --job-minutes 170 --basetemp-root "$env:USERPROFILE\pt\b" --results "$env:RUNNER_TEMP\suite-results" --ledger-root "$env:RUNNER_TEMP\suite-ledger" --report "$env:RUNNER_TEMP\suite-results\run-manifest.json"
          $code = $LASTEXITCODE
          exit $code
      - name: Upload shard results
        id: upload-tier2-shard
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-suite-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/suite-results/
            ${{ runner.temp }}/suite-ledger/
          if-no-files-found: error
      - name: Record shard upload outcome
        if: always()
        run: '"windows-suite-shard-${{ matrix.shard }} upload: ${{ steps.upload-tier2-shard.outcome }}" | Add-Content $env:GITHUB_STEP_SUMMARY'

  targets-run:
    runs-on: windows-latest
    needs: [plan-suite, build-native]
    if: github.event_name == 'workflow_dispatch' && inputs.selection == 'targets'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-suite-plan
          path: ${{ runner.temp }}/suite-in/plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-editable-native
          path: ${{ runner.temp }}/suite-in/native
      - name: Restore editable native bundle
        run: |
          New-Item -ItemType Directory -Force -Path "src\hyprial\_core" | Out-Null
          Copy-Item -Path "$env:RUNNER_TEMP\suite-in\native\*" -Destination "src\hyprial\_core" -Force
      - name: Install the editable test environment
        timeout-minutes: 20
        run: |
          uv sync --locked --python $env:PYTHON_VERSION --extra test
          $code = $LASTEXITCODE
          exit $code
      - name: Run targets waves
        timeout-minutes: 30
        env:
          WINDOWS_SUITE_ACL_PROBE: ${{ inputs.acl_probe || false }}
        run: |
          .venv\Scripts\python.exe scripts/ci/windows/run_waves.py --tier 2 --plan-manifest "$env:RUNNER_TEMP\suite-in\plan\plan-manifest.json" --shard 0 --workers 2 --watchdog-seconds 600 --idle-seconds 900 --wave-minutes 20 --deadline-minutes 25 --step-minutes 30 --job-minutes 45 --basetemp-root "$env:USERPROFILE\pt\b" --results "$env:RUNNER_TEMP\suite-results" --ledger-root "$env:RUNNER_TEMP\suite-ledger" --report "$env:RUNNER_TEMP\suite-results\run-manifest.json"
          $code = $LASTEXITCODE
          exit $code
      - name: Upload targets results
        id: upload-targets
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-suite-targets
          path: |
            ${{ runner.temp }}/suite-results/
            ${{ runner.temp }}/suite-ledger/
          if-no-files-found: error
      - name: Record targets upload outcome
        if: always()
        run: '"windows-suite-targets upload: ${{ steps.upload-targets.outcome }}" | Add-Content $env:GITHUB_STEP_SUMMARY'

  tier1-admission:
    runs-on: windows-latest
    needs: [plan-suite, build-native]
    if: github.event_name == 'workflow_dispatch' && inputs.selection == 'tier1-next'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-suite-plan
          path: ${{ runner.temp }}/suite-in/plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-editable-native
          path: ${{ runner.temp }}/suite-in/native
      - name: Restore editable native bundle
        run: |
          New-Item -ItemType Directory -Force -Path "src\hyprial\_core" | Out-Null
          Copy-Item -Path "$env:RUNNER_TEMP\suite-in\native\*" -Destination "src\hyprial\_core" -Force
      - name: Install the editable test environment
        timeout-minutes: 20
        run: |
          uv sync --locked --python $env:PYTHON_VERSION --extra test
          $code = $LASTEXITCODE
          exit $code
      - name: Run tier1-next waves
        timeout-minutes: 30
        env:
          WINDOWS_SUITE_ACL_PROBE: ${{ inputs.acl_probe || false }}
        run: |
          .venv\Scripts\python.exe scripts/ci/windows/run_waves.py --tier 2 --plan-manifest "$env:RUNNER_TEMP\suite-in\plan\plan-manifest.json" --shard 0 --workers 2 --watchdog-seconds 300 --idle-seconds 600 --wave-minutes 20 --deadline-minutes 25 --step-minutes 30 --job-minutes 45 --basetemp-root "$env:USERPROFILE\pt\b" --results "$env:RUNNER_TEMP\suite-results" --ledger-root "$env:RUNNER_TEMP\suite-ledger" --report "$env:RUNNER_TEMP\suite-results\run-manifest.json"
          $code = $LASTEXITCODE
          exit $code
      - name: Upload tier1-next results
        id: upload-tier1-next
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-suite-tier1-next
          path: |
            ${{ runner.temp }}/suite-results/
            ${{ runner.temp }}/suite-ledger/
          if-no-files-found: error
      - name: Record tier1-next upload outcome
        if: always()
        run: '"windows-suite-tier1-next upload: ${{ steps.upload-tier1-next.outcome }}" | Add-Content $env:GITHUB_STEP_SUMMARY'

  arm-admission:
    runs-on: windows-11-arm
    needs: [plan-suite, build-native]
    if: github.event_name == 'workflow_dispatch' && inputs.selection == 'arm-next'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-suite-plan
          path: ${{ runner.temp }}/suite-in/plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-editable-native
          path: ${{ runner.temp }}/suite-in/native
      - name: Restore editable native bundle
        run: |
          New-Item -ItemType Directory -Force -Path "src\hyprial\_core" | Out-Null
          Copy-Item -Path "$env:RUNNER_TEMP\suite-in\native\*" -Destination "src\hyprial\_core" -Force
      - name: Create the x64 emulated environment
        run: |
          uv venv --python cpython-3.12-windows-x86_64
          $code = $LASTEXITCODE
          exit $code
      - name: Install the editable test environment
        timeout-minutes: 20
        run: |
          uv sync --locked --python cpython-3.12-windows-x86_64 --extra test
          $code = $LASTEXITCODE
          exit $code
      - name: Run arm-next waves
        timeout-minutes: 30
        env:
          WINDOWS_SUITE_ACL_PROBE: ${{ inputs.acl_probe || false }}
        run: |
          .venv\Scripts\python.exe scripts/ci/windows/run_waves.py --tier 2 --plan-manifest "$env:RUNNER_TEMP\suite-in\plan\plan-manifest.json" --shard 0 --workers 2 --watchdog-seconds 300 --idle-seconds 600 --wave-minutes 20 --deadline-minutes 25 --step-minutes 30 --job-minutes 45 --basetemp-root "$env:USERPROFILE\pt\b" --results "$env:RUNNER_TEMP\suite-results" --ledger-root "$env:RUNNER_TEMP\suite-ledger" --report "$env:RUNNER_TEMP\suite-results\run-manifest.json"
          $code = $LASTEXITCODE
          exit $code
      - name: Upload arm-next results
        id: upload-arm-next
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-suite-arm-next
          path: |
            ${{ runner.temp }}/suite-results/
            ${{ runner.temp }}/suite-ledger/
          if-no-files-found: error
      - name: Record arm-next upload outcome
        if: always()
        run: '"windows-suite-arm-next upload: ${{ steps.upload-arm-next.outcome }}" | Add-Content $env:GITHUB_STEP_SUMMARY'

  windows-suite-summary:
    runs-on: ubuntu-latest
    needs: [plan-suite, build-native, tier2-pytest, targets-run, tier1-admission, arm-admission]
    if: always()
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: ${{ runner.temp }}/suite-artifacts
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: ${{ env.UV_VERSION }}
      - name: Summarize suite results
        run: |
          uv run --no-project --python "$PYTHON_VERSION" python scripts/ci/windows/summarize.py --mode suite --plan-manifest "${{ runner.temp }}/suite-artifacts/windows-suite-plan/plan-manifest.json" --expected-failures scripts/ci/windows/expected-failures.json --input "${{ runner.temp }}/suite-artifacts/windows-suite-shard-0=shard-0" --input "${{ runner.temp }}/suite-artifacts/windows-suite-shard-1=shard-1" --input "${{ runner.temp }}/suite-artifacts/windows-suite-shard-2=shard-2" --input "${{ runner.temp }}/suite-artifacts/windows-suite-shard-3=shard-3" --input "${{ runner.temp }}/suite-artifacts/windows-suite-targets=targets" --input "${{ runner.temp }}/suite-artifacts/windows-suite-tier1-next=tier1-next" --input "${{ runner.temp }}/suite-artifacts/windows-suite-arm-next=arm-next"
          code=$?
          exit $code
