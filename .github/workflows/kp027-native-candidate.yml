              "source_sha": receipt["source_sha"],
              "target": "linux/arm64",
              "build_host": assembly["assembly_host"],
              "native_prebuilt": True,
              "wheel": wheel.name,
              "wheel_sha256": wheel_sha256,
              "module_sha256": receipt["sha256"],
              "engine_abi_version": receipt["engine_abi_version"],
              "platform_tag": receipt["platform_tag"],
              "smoke": "pass",
              "smoke_host": f"{platform.system()}/{platform.machine()}",
          }
          out = wheel.parent / "wheel-evidence.json"
          out.write_text(json.dumps(document, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"{out}: {document['wheel']} {document['wheel_sha256']}")
          PY
          cat "${receipt_dir}/receipt.json"

      - name: Stage product receipt and evidence
        run: |
          set -eu
          trap '' PIPE
          mkdir -p product-receipt-artifact
          cp product-receipts/linux-arm64/receipt.json product-receipt-artifact/
          cp product-wheel/wheel-evidence.json product-receipt-artifact/
          find product-receipt-artifact -maxdepth 1 -type f -print

      - name: Ensure Node 16 for the artifact action
        run: |
          set -eu
          trap '' PIPE
