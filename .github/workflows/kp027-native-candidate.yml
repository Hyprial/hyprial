          uv run --no-project --python 3.12 python - "${wheel}" "${receipt_dir}/receipt.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import platform
          import sys

          wheel = pathlib.Path(sys.argv[1])
          receipt = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          assembly = json.loads(
              (wheel.parent / "assembly-evidence.json").read_text(encoding="utf-8")
          )
          wheel_sha256 = hashlib.sha256(wheel.read_bytes()).hexdigest()
