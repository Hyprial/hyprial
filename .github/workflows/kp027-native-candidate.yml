          )"
          tailcat="$("${smoke_python}" - <<'PY'
          import pathlib
          import sysconfig
          binary = pathlib.Path(sysconfig.get_paths()["purelib"]) / "hyprial" / "_bin" / "hyprial-tailcat"
          if not binary.is_file():
              raise SystemExit(f"missing installed sidecar: {binary}")
          print(binary)
          PY
          )"
