name: tsnet-windows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-unit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Check out byte-identical to the repository: autocrlf on windows-latest
      # rewrites LF to CRLF, which breaks the GUI snapshot hashes checked at
      # install (gui_bundle.py, "GUI snapshot input changed", run 36390125901).
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecar/hyprial-tsnet/go.mod
          cache-dependency-path: sidecar/hyprial-tsnet/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6

      - name: Test the Go sidecar on Windows
        working-directory: sidecar/hyprial-tsnet
        run: go test ./...

      - name: Build the Windows amd64 sidecar
        shell: pwsh
        working-directory: sidecar/hyprial-tsnet
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -o hyprial-tsnet-windows-amd64.exe ./cmd/hyprial-tsnet
          if (-not (Test-Path hyprial-tsnet-windows-amd64.exe)) { throw "Windows sidecar build did not produce an .exe" }

      - name: Test the Windows Python client and forwarding configuration
        shell: pwsh
        run: |
          uv sync --extra test
          uv run pytest -q tests/test_tsnet_windows.py

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Check out byte-identical to the repository: autocrlf on windows-latest
      # rewrites LF to CRLF, which breaks the GUI snapshot hashes checked at
      # install (gui_bundle.py, "GUI snapshot input changed", run 36390125901).
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecar/hyprial-tsnet/go.mod
          cache-dependency-path: sidecar/hyprial-tsnet/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build a local file release tree
        id: release
        shell: pwsh
        working-directory: sidecar/hyprial-tsnet
        run: |
          $match = Select-String -Path "../../src/hyprial/tsnet_sidecar.py" -Pattern '^SIDECAR_VERSION = "([^"]+)"$'
          $version = $match.Matches[0].Groups[1].Value
          $releaseRoot = Join-Path $env:RUNNER_TEMP "sidecar-release"
          $tagDir = Join-Path $releaseRoot "tsnet-v$version"
          New-Item -ItemType Directory -Force -Path $tagDir | Out-Null
          $asset = Join-Path $tagDir "hyprial-tsnet-windows-amd64.exe"
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -o $asset ./cmd/hyprial-tsnet
          "release_root=$releaseRoot" >> $env:GITHUB_OUTPUT

      - name: Install hyprial from this public snapshot
        id: install
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "hyprial-smoke-venv"
          python -m venv $venv
          $python = Join-Path $venv "Scripts/python.exe"
          & $python -m pip install --disable-pip-version-check .
          "python=$python" >> $env:GITHUB_OUTPUT

      - name: Install the local sidecar and inspect an isolated daemon
        shell: pwsh
        env:
          SMOKE_PYTHON: ${{ steps.install.outputs.python }}
          SIDECAR_RELEASE_ROOT: ${{ steps.release.outputs.release_root }}
          HYPRIAL_HOME: ${{ runner.temp }}\hyprial-smoke-home
          HARNESS_STATE_DIR: ${{ runner.temp }}\hyprial-smoke-state
          HYPRIAL_NETWORK_ISOLATED: "1"
          HYPRIAL_FORWARDING: "off"
          HYPRIAL_OWNER: windows-smoke
          HYPRIAL_NODE_ID: windows-smoke
        run: |
          @'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time

          from hyprial import tsnet_sidecar

          home = Path(os.environ["HYPRIAL_HOME"])
          home.mkdir(parents=True, exist_ok=True)
          (home / "settings.json").write_text(
              json.dumps({"version": 1, "owner": os.environ["HYPRIAL_OWNER"]}),
              encoding="utf-8",
          )
          release_root = Path(os.environ["SIDECAR_RELEASE_ROOT"])
          asset = release_root / tsnet_sidecar.sidecar_tag() / "hyprial-tsnet-windows-amd64.exe"
          # Test-only runtime trust for this local build. It is neither
          # persisted nor a substitute for the later published-asset pin.
          tsnet_sidecar.SIDECAR_SHA256["windows-amd64"] = hashlib.sha256(asset.read_bytes()).hexdigest()
          os.environ[tsnet_sidecar.SIDECAR_RELEASE_BASE_URL_ENV] = release_root.as_uri()
          installed = tsnet_sidecar.install_sidecar(home, confirm=lambda _plan: True)
          destination = Path(installed["destination"])
          assert destination.name == "hyprial-tsnet.exe", installed
          assert destination.read_bytes() == asset.read_bytes()

          log = Path(os.environ["RUNNER_TEMP"]) / "hyprial-smoke-daemon.log"
          with log.open("w+", encoding="utf-8") as stream:
              daemon = subprocess.Popen(
                  [sys.executable, "-m", "hyprial.cli", "daemon", "run", "--json"],
                  stdout=stream,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              try:
                  status = None
                  for _ in range(60):
                      if daemon.poll() is not None:
                          break
                      probe = subprocess.run(
                          [sys.executable, "-m", "hyprial.cli", "ps", "--json"],
                          capture_output=True,
                          text=True,
                          timeout=5,
                      )
                      if probe.returncode == 0:
                          status = json.loads(probe.stdout)
                          break
                      time.sleep(0.5)
                  if status is None:
                      stream.flush()
                      stream.seek(0)
                      raise AssertionError(f"isolated daemon did not become inspectable: {stream.read()}")
                  forwarding = status["forwarding"]
                  assert forwarding["state"] == "off", forwarding
                  assert forwarding["policy"] == {"mode": "off", "source": "env"}, forwarding
                  assert status["zenoh"]["isolated"] is True, status["zenoh"]
              finally:
                  if daemon.poll() is None:
                      daemon.terminate()
                  daemon.wait(timeout=20)
          '@ | & $env:SMOKE_PYTHON -

  headscale-secret:
    runs-on: windows-latest
    outputs:
      available: ${{ steps.presence.outputs.available }}
    steps:
      - id: presence
        shell: pwsh
        env:
          PREAUTH_KEY: ${{ secrets.HYPRIAL_TSNET_HEADSCALE_PREAUTH_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:PREAUTH_KEY)) {
            "available=false" >> $env:GITHUB_OUTPUT
          } else {
            "available=true" >> $env:GITHUB_OUTPUT
          }

  windows-headscale-join:
    needs: [windows-unit, headscale-secret]
    if: needs.headscale-secret.outputs.available == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Check out byte-identical to the repository: autocrlf on windows-latest
      # rewrites LF to CRLF, which breaks the GUI snapshot hashes checked at
      # install (gui_bundle.py, "GUI snapshot input changed", run 36390125901).
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecar/hyprial-tsnet/go.mod
          cache-dependency-path: sidecar/hyprial-tsnet/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install snapshot and build candidate
        shell: pwsh
        working-directory: sidecar/hyprial-tsnet
        run: |
          python -m pip install --disable-pip-version-check ../..
          $match = Select-String -Path "../../src/hyprial/tsnet_sidecar.py" -Pattern '^SIDECAR_VERSION = "([^"]+)"$'
          $version = $match.Matches[0].Groups[1].Value
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $ldflags = "-X code.hyprial.com/HyprialOS/harness-bridge/sidecar/hyprial-tsnet/internal/buildinfo.SidecarVersion=$version"
          go build -trimpath -ldflags $ldflags -o "$env:RUNNER_TEMP\hyprial-tsnet-windows-amd64.exe" ./cmd/hyprial-tsnet

      - name: Join the real Headscale control plane
        shell: pwsh
        env:
          HYPRIAL_TSNET_HEADSCALE_PREAUTH_KEY: ${{ secrets.HYPRIAL_TSNET_HEADSCALE_PREAUTH_KEY }}
          HYPRIAL_HOME: ${{ runner.temp }}\hyprial-headscale-home
          HYPRIAL_NODE_ID: gha-windows-amd64
        run: |
          @'
          import hashlib
          import json
          import os
          from pathlib import Path

          from hyprial import tsnet_sidecar
          from hyprial.network_profile import NetworkProfile
          from hyprial.tsnet_join import run_join

          home = Path(os.environ["HYPRIAL_HOME"])
          home.mkdir(parents=True, exist_ok=True)
          candidate = Path(os.environ["RUNNER_TEMP"]) / "hyprial-tsnet-windows-amd64.exe"
          destination = tsnet_sidecar.sidecar_binary_path(home)
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(candidate.read_bytes())
          # Test-only runtime trust for this candidate. The release workflow
          # remains fail-closed until an authorized published asset is pinned.
          tsnet_sidecar.SIDECAR_SHA256["windows-amd64"] = hashlib.sha256(candidate.read_bytes()).hexdigest()
          profile = NetworkProfile(
              org="github-actions",
              issuer="https://auth.hyprial.com",
              client_id="2cdd1defc1a0e219fafb",
              control_plane_kind="headscale",
              control_plane_url="https://head.hyprial.ai",
              join="preauthkey",
          )
          outcome = run_join(
              profile,
              hyprial_home=home,
              preauthkey_file="-",
              read_stdin=lambda: os.environ["HYPRIAL_TSNET_HEADSCALE_PREAUTH_KEY"],
              open_browser=False,
          )
          if outcome.status != "joined":
              raise AssertionError(json.dumps(outcome.as_network(), sort_keys=True))
          '@ | python -
