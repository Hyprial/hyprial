    harness: claude
    model: claude-opus-5-5
    cwd: /private/tmp/hf-wp2-send-links
  task: '【WP2 设计】范围：links/store.py 与 links/service.py：在 OrgFs 协议上读写 org 空间 link/ 目录下每 agent 一份的文件（两份互引才有效）；订阅 hook bus 喂控制器样本；实现 ports.LinkGate 与 LinkQueries；维护 outbox 中 hold 消息的重评与放行；在 daemon/impl/composition 接线。不 import inbox service。

    仓库 cwd 即你的 worktree（分支 wp<N>/send-links，base 为集成分支 refactor/org-structure-constrain）。先读 docs/design/design-send-links-2026-10-14.md 与 docs/design/send-links-impl/README.md，再读 src/hyprial/daemon/impl/links/ports.py（缝，不得改名）。规则：禁止裸跑 python，一律 uv run；测试命令 PYTHONPATH=$PWD/src uv run --extra test pytest <焦点路径> -q；改产品或测试结构后跑 uv run --no-project --python 3.12 python scripts/ci/check_structural_limits.py 与 check_module_boundaries.py；交付前 uv run --with ruff ruff check <改动文件>。每目录最多 7 个直接文件、每文件最多 1000 行。只 git add 具体文件，不用 -a。提交用 conventional commit，只在本地提交，不要 push、不要开 PR、不要给任何 agent 发消息（全网静默）。完成用 hyprial workflow complete 并把结论写在 --output-text；失败用 workflow fail。

    产物：写 docs/design/send-links-impl/wp2.md，内容依次为：改哪些文件（含新建）、公共面与接口怎么变（必须与 ports.py 一致）、测试清单（每条写测什么、先红时的失败形状、放在 tests/ 哪个路径）、验收标准（可机检）、要留的证据。不写实现代码。提交该文件后 complete，--output-text 写规格路径与一段摘要。'
  after:
