version: 2
name: send-links-2026-10-14
on_failure: continue
defaults:
  timeout: 2h
  launch:
    harness: pi
    provider: deepseek
    model: deepseek-flash
    cwd: /private/tmp/hf-wp1-send-links
nodes:
- id: wp1-review
  role: review
  timeout: 1h
  launch:
    harness: pi
    provider: openai-codex
    model: gpt-6.1-sol
    cwd: /private/tmp/hf-wp1-send-links
  task: '【WP1 评审】仓库 cwd 即你的 worktree（分支 wp<N>/send-links，base 为集成分支 refactor/org-structure-constrain）。先读 docs/design/design-send-links-2026-10-14.md 与 docs/design/send-links-impl/README.md，再读 src/hyprial/daemon/impl/links/ports.py（缝，不得改名）。规则：禁止裸跑 python，一律 uv run；测试命令 PYTHONPATH=$PWD/src uv run --extra test pytest <焦点路径> -q；改产品或测试结构后跑 uv run --no-project --python 3.12 python scripts/ci/check_structural_limits.py 与 check_module_boundaries.py；交付前 uv run --with ruff ruff check <改动文件>。每目录最多 7 个直接文件、每文件最多 1000 行。只 git add 具体文件，不用 -a。提交用 conventional commit，只在本地提交，不要 push、不要开 PR、不要给任何 agent 发消息（全网静默）。完成用 hyprial workflow complete 并把结论写在 --output-text；失败用 workflow fail。

    评审 docs/design/send-links-impl/wp1.md（已由设计节点提交在本分支）：对照 docs/design/design-send-links-2026-10-14.md，找出与设计矛盾处、漏掉的测试（尤其设计 §5.6 的劣化条件与 §4 的边界）、越层依赖（kernel→identity→daemon→biz→shell 单向；links 不得 import inbox service）、与 ports.py 不一致处。把意见追加到该文件末尾的「评审」节，每条标 阻断/建议，并对每条阻断项直接写出修正后的规格文字（实施节点会照规格加评审节执行）。提交后 complete；--output-text 第一行写 BLOCKING:<n> 与 ADVISORY:<n>。'
- id: wp1-implement
  role: execute
  timeout: 6h
  launch:
    harness: pi
    provider: deepseek
    model: deepseek-flash
    cwd: /private/tmp/hf-wp1-send-links
  after:
  - wp1-review
  task: '【WP1 实施】仓库 cwd 即你的 worktree（分支 wp<N>/send-links，base 为集成分支 refactor/org-structure-constrain）。先读 docs/design/design-send-links-2026-10-14.md 与 docs/design/send-links-impl/README.md，再读 src/hyprial/daemon/impl/links/ports.py（缝，不得改名）。规则：禁止裸跑 python，一律 uv run；测试命令 PYTHONPATH=$PWD/src uv run --extra test pytest <焦点路径> -q；改产品或测试结构后跑 uv run --no-project --python 3.12 python scripts/ci/check_structural_limits.py 与 check_module_boundaries.py；交付前 uv run --with ruff ruff check <改动文件>。每目录最多 7 个直接文件、每文件最多 1000 行。只 git add 具体文件，不用 -a。提交用 conventional commit，只在本地提交，不要 push、不要开 PR、不要给任何 agent 发消息（全网静默）。完成用 hyprial workflow complete 并把结论写在 --output-text；失败用 workflow fail。

    严格按 docs/design/send-links-impl/wp1.md（含评审节的修正）实现。先写测试清单里的测试并运行确认先红，再实现到绿。每个提交可读可测。不要扩大范围，规格没写的不做；规格有歧义时在 --output-text 里写明你的取舍。完成时 --output-text 写：改动文件列表、焦点测试命令与结果（含先红证据）、结构门与 ruff 结果、未做项与原因。'
- id: wp1-accept
  role: review
  timeout: 2h
  launch:
    harness: claude
    model: claude-opus-5-5
    cwd: /private/tmp/hf-wp1-send-links
  after:
  - wp1-implement
  task: '【WP1 验收】仓库 cwd 即你的 worktree（分支 wp<N>/send-links，base 为集成分支 refactor/org-structure-constrain）。先读 docs/design/design-send-links-2026-10-14.md 与 docs/design/send-links-impl/README.md，再读 src/hyprial/daemon/impl/links/ports.py（缝，不得改名）。规则：禁止裸跑 python，一律 uv run；测试命令 PYTHONPATH=$PWD/src uv run --extra test pytest <焦点路径> -q；改产品或测试结构后跑 uv run --no-project --python 3.12 python scripts/ci/check_structural_limits.py 与 check_module_boundaries.py；交付前 uv run --with ruff ruff check <改动文件>。每目录最多 7 个直接文件、每文件最多 1000 行。只 git add 具体文件，不用 -a。提交用 conventional commit，只在本地提交，不要 push、不要开 PR、不要给任何 agent 发消息（全网静默）。完成用 hyprial workflow complete 并把结论写在 --output-text；失败用 workflow fail。

    逐条对 docs/design/send-links-impl/wp1.md 的验收标准核实施：复跑其焦点测试、结构门与 ruff；核先红证据（git log 与测试输出）；检查越层依赖与 7 文件/1000 行限制；检查没有偷改 ports.py 的名字。不符合则 fail 并在 --output-text 列出不符项；符合则 complete，--output-text 写 ACCEPTED 与验证命令及结果。你不合并分支。'
- id: wp1-merge
  owner: agent:bob.smith@example.com:node-hq-01.example-tailnet.ts.net:emergent-org-structure-refactor
  role: dispatch
  timeout: 24h
  after:
  - wp1-accept
  task: 【WP1 合并】集成者把 wp1/send-links 合进 refactor/org-structure-constrain 并推送。
- id: wp2-design
  role: plan
  timeout: 2h
